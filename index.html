<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>君は君にはなれない</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;color:#f4f1ea;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;overflow:hidden}
.layer{position:absolute;inset:0}
/* backgrounds */
#bg,#bgimg{transition:opacity 1s ease, background 1.2s ease}
#bgimg{background-size:cover;background-position:center;opacity:0}
.bg-black{background:#000}
.bg-room_day_old{background:radial-gradient(ellipse at 78% 18%,rgba(255,250,225,.85),transparent 50%),linear-gradient(#cdb796,#7d6248)}
.bg-room_warm{background:radial-gradient(ellipse at 72% 28%,rgba(255,196,120,.38),transparent 55%),radial-gradient(ellipse at 20% 80%,rgba(120,180,170,.12),transparent 50%),linear-gradient(#3b2a1e,#170f0a)}
.bg-room_night{background:radial-gradient(ellipse at 70% 35%,rgba(255,190,110,.25),transparent 50%),radial-gradient(ellipse at 30% 40%,rgba(90,140,255,.18),transparent 45%),linear-gradient(#251b17,#0c0807)}
.bg-rubble{background:radial-gradient(ellipse at 50% 10%,rgba(220,210,200,.25),transparent 60%),linear-gradient(#5d5752,#262321)}
.bg-white_room{background:radial-gradient(ellipse at 50% 30%,#ffffff,#d9dde0)}
.bg-funeral{background:radial-gradient(ellipse at 50% 35%,#fffdf7,#cfcac0 80%)}
.bg-room_dark{background:radial-gradient(ellipse at 40% 70%,rgba(80,110,170,.18),transparent 45%),linear-gradient(#0f1422,#05070c)}
.bg-door_rain{background:radial-gradient(ellipse at 50% 15%,rgba(255,236,190,.22),transparent 40%),linear-gradient(#1c2734,#090d13)}
.bg-room_new_night{background:radial-gradient(ellipse at 65% 30%,rgba(255,206,140,.3),transparent 55%),linear-gradient(#2a2733,#100e14)}
.bg-room_morning{background:radial-gradient(ellipse at 80% 20%,rgba(255,255,240,.9),transparent 50%),linear-gradient(#f3e6cf,#c9b393)}
.bg-room_late{background:radial-gradient(ellipse at 50% 45%,rgba(70,120,255,.35),transparent 45%),linear-gradient(#070a14,#020306)}
.bg-park_night{background:radial-gradient(circle at 30% 20%,rgba(255,214,140,.35),transparent 30%),linear-gradient(#0d1729,#04060c)}
.bg-park_morning{background:radial-gradient(ellipse at 70% 10%,rgba(255,255,230,.9),transparent 50%),linear-gradient(#bcdcf0,#efe8d6)}
.bg-street_morning{background:linear-gradient(#d4e3ee,#f1ece2)}
.bg-room_dim{background:radial-gradient(ellipse at 50% 50%,rgba(90,130,255,.22),transparent 40%),linear-gradient(#1b1d24,#0b0c10)}
.bg-hospital_day{background:linear-gradient(#e9f1f2,#c8d6d9)}
.bg-hospital_night{background:radial-gradient(ellipse at 80% 30%,rgba(255,220,170,.15),transparent 40%),linear-gradient(#12222b,#060c10)}
.bg-hospital_morning{background:radial-gradient(ellipse at 20% 20%,rgba(255,255,245,.95),transparent 55%),linear-gradient(#eef5f6,#cfdfe2)}
.bg-room_evening{background:radial-gradient(ellipse at 80% 70%,rgba(255,170,90,.6),transparent 55%),linear-gradient(#f2a46b,#6a4a78)}
/* sprite */
#charWrap{pointer-events:none}
.spr{position:absolute;left:50%;top:-4.3%;height:184%;width:auto;transform:translateX(-50%);opacity:0;transition:opacity .45s ease}
#charWrap.full .spr{top:auto;bottom:0;height:96%}
.spr.on{opacity:1}
.cg{background-size:cover;background-position:center;opacity:0;transition:opacity 1s ease;pointer-events:none}
.cg.on{opacity:1}
#rain{pointer-events:none;opacity:0;transition:opacity 1.5s}
#rain.on{opacity:1}
#rain{z-index:3}#dimmer{z-index:4}#center{z-index:5}#ui{z-index:6}#white{z-index:7}#fader{z-index:8}
#fader{background:#000;opacity:0;pointer-events:none;transition:opacity .8s ease}
#fader.on{opacity:1}
#white{background:#fff;opacity:0;pointer-events:none}
#dimmer{background:#000;opacity:0;pointer-events:none;transition:opacity 2s}
@keyframes quake{0%,100%{transform:translate(0,0)}10%{transform:translate(-14px,8px)}20%{transform:translate(12px,-10px)}30%{transform:translate(-10px,-6px)}40%{transform:translate(9px,10px)}50%{transform:translate(-12px,4px)}60%{transform:translate(10px,-8px)}70%{transform:translate(-6px,7px)}80%{transform:translate(6px,-4px)}90%{transform:translate(-3px,2px)}}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-8px,3px)}50%{transform:translate(7px,-3px)}75%{transform:translate(-4px,2px)}}
@keyframes knock{0%,100%{transform:translate(0)}20%{transform:translate(2px,0)}40%{transform:translate(0)}60%{transform:translate(2px,0)}}
.quake{animation:quake 1.4s ease-out}
.shake{animation:shake .35s ease-out}
.knock{animation:knock .6s ease-out}
@keyframes whiteout{0%{opacity:0}25%{opacity:1}70%{opacity:1}100%{opacity:0}}
#white.go{animation:whiteout 2.6s ease forwards}
/* text box */
#ui{transition:opacity .3s}
#ui.hidden{opacity:0;pointer-events:none}
#box{position:absolute;left:50%;bottom:calc(3vh + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(1100px,94vw);min-height:min(25vh,210px);padding:30px 40px 34px;background:linear-gradient(rgba(12,14,22,.72),rgba(8,9,15,.86));border:1px solid rgba(255,255,255,.14);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 10px 40px rgba(0,0,0,.45);cursor:pointer}
#name{position:absolute;top:-17px;left:28px;padding:5px 22px;font-size:16px;letter-spacing:.15em;background:#1d2a33;border:1px solid rgba(255,255,255,.2);border-radius:999px;opacity:0;transition:opacity .2s}
#name.on{opacity:1}
#name.miku{background:linear-gradient(90deg,#167f7a,#1f9e93)}
#name.shio{background:linear-gradient(90deg,#1a7f8f,#6a8fd6)}
#name.wataru{background:linear-gradient(90deg,#3a3f52,#545a72)}
#text{font-size:clamp(16px,2.05vw,21px);line-height:1.95;letter-spacing:.04em;white-space:pre-wrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#next{position:absolute;right:26px;bottom:14px;font-size:13px;opacity:0;animation:blink 1.2s infinite}
#next.on{opacity:1}
@keyframes blink{50%{opacity:.25}}
#center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(22px,3.4vw,38px);letter-spacing:.18em;line-height:2;text-shadow:0 2px 16px rgba(0,0,0,.8);opacity:0;transition:opacity 1s;pointer-events:none;padding:0 6vw}
#center.on{opacity:1}
#center.oncg{align-items:flex-end;padding-bottom:9vh}
#center span{display:inline-block}
#center.oncg span{background:rgba(6,8,14,.62);padding:10px 48px;border-radius:10px;backdrop-filter:blur(4px)}
#bar{position:absolute;right:14px;top:-40px;display:flex;gap:6px}
#bar button,.menu button{font-family:inherit;color:#f4f1ea;background:rgba(10,12,18,.55);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 14px;font-size:12px;letter-spacing:.12em;cursor:pointer}
#bar button:hover,.menu button:hover{background:rgba(40,150,140,.55)}
#bar button.active{background:rgba(31,158,147,.85)}
/* screens */
.screen{position:fixed;inset:0;display:none;z-index:50}
.screen.on{display:flex}
.screen{padding-top:env(safe-area-inset-top)}
#log,#settings,#gallery{padding-top:max(6vh,env(safe-area-inset-top))!important}
#title{flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#173a40 0%,#07090e 70%)}
#title.hasimg{background:#000 center/cover no-repeat;justify-content:flex-end;padding-bottom:calc(5vh + env(safe-area-inset-bottom))}
#title.hasimg::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 38%,rgba(10,6,24,.55) 62%,rgba(6,4,16,.9) 100%);pointer-events:none}
#title.hasimg>*{position:relative}
#title.hasimg h1{margin-bottom:6px;text-shadow:0 2px 18px rgba(0,0,0,.85),0 0 30px rgba(120,80,200,.5)}
#title.hasimg .sub{margin-bottom:26px;opacity:.75;text-shadow:0 1px 6px #000}
#title.hasimg .menu{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:10px;max-width:92vw}
#title.hasimg .menu button{background:rgba(14,10,28,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-width:150px}
#title.hasimg .hint{margin-top:14px;text-shadow:0 1px 4px #000}
@media (orientation:portrait){#title.hasimg .menu{display:grid;grid-template-columns:1fr 1fr;width:88vw}#title.hasimg .menu button{min-width:0;padding:11px 8px;font-size:14px}#title.hasimg{background-position:48% center}#title.hasimg h1{font-size:7.6vw;letter-spacing:.14em}#title.hasimg .menu button:last-child{grid-column:1/3}}
@media (max-height:520px) and (orientation:landscape){#title.hasimg .sub{margin-bottom:12px}#title.hasimg .menu button{padding:6px 14px;min-width:0;font-size:13px}#title.hasimg h1{font-size:26px}#title.hasimg{background-position:center 12%}#title.hasimg .menu{gap:7px;flex-wrap:nowrap}}
#title h1{font-weight:600;font-size:clamp(30px,5.6vw,64px);letter-spacing:.3em;margin-bottom:12px;text-shadow:0 0 30px rgba(60,200,190,.35)}
#title .sub{font-size:13px;letter-spacing:.5em;opacity:.6;margin-bottom:52px}
.menu{display:flex;flex-direction:column;gap:14px;min-width:240px}
.menu button{font-size:15px;padding:12px 26px}
.menu button:disabled{opacity:.3;cursor:default}
#log,#settings,#gallery{background:rgba(4,6,10,.92);flex-direction:column;align-items:center;padding:6vh 4vw}
.panel{width:min(900px,100%);flex:1;overflow-y:auto;padding-right:10px}
.panel h2{font-weight:600;letter-spacing:.3em;font-size:18px;margin-bottom:20px}
.logitem{margin-bottom:16px;line-height:1.8;font-size:15px}
.logitem b{display:block;font-size:12px;letter-spacing:.15em;color:#7fd3c9}
.close{margin-top:18px}
.row{margin:18px 0;font-size:14px;line-height:1.9}
.row input[type=range]{width:240px;vertical-align:middle}
.note{font-size:12.5px;opacity:.72;line-height:1.9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.grid div{background:#111620;border:1px solid #2a3240;border-radius:8px;padding:6px;text-align:center;font-size:11px}
.grid img{width:100%;height:140px;object-fit:contain}
.ok{color:#7fd3c9}.ng{color:#d58a8a}
#nameInput{background:rgba(0,0,0,.35);align-items:flex-end;justify-content:center;padding-bottom:9vh}
#nameInput .np{background:linear-gradient(rgba(12,14,22,.85),rgba(8,9,15,.92));border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:26px 34px;text-align:center;min-width:min(420px,90vw)}
#nameInput p{font-size:14px;letter-spacing:.15em;margin-bottom:16px;opacity:.85}
#nameInput input{font-family:inherit;font-size:22px;text-align:center;letter-spacing:.12em;width:100%;padding:10px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(127,211,201,.6);border-radius:8px;outline:none;-webkit-user-select:text;user-select:text}
#nameInput .menu{margin-top:16px}
#chapters{background:#05070b;flex-direction:column;align-items:center;padding:6vh 4vw}
.chapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.chap{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.15);background:#111 center/cover}
.chap::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.82))}
.chap:hover{border-color:rgba(127,211,201,.8)}
.chap>div{position:absolute;left:14px;right:10px;bottom:10px;z-index:1;line-height:1.5}
.chap .n{font-size:11px;letter-spacing:.3em;color:#7fd3c9}.chap .t{font-size:15px;letter-spacing:.1em}
#galList .t{word-break:keep-all;overflow-wrap:anywhere;line-height:1.4}
.chap.cur{border-color:#1f9e93;box-shadow:0 0 0 2px rgba(31,158,147,.6)}
#chapCard{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .7s}
#chapCard.on{opacity:1;pointer-events:auto}
#chapCard .no{font-size:13px;letter-spacing:.6em;color:#7fd3c9;margin-bottom:14px}
#chapCard .ti{font-size:clamp(22px,3.6vw,36px);letter-spacing:.25em;text-align:center;padding:0 6vw}
@media (orientation:portrait){.chapgrid{grid-template-columns:1fr 1fr;gap:10px}.chap .t{font-size:13px}.chap>div{left:10px;bottom:6px}}
#chapLabel{position:absolute;top:calc(14px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));padding:5px 14px;font-size:12px;letter-spacing:.14em;background:rgba(8,10,16,.55);border:1px solid rgba(255,255,255,.12);border-radius:999px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .6s;pointer-events:none}
#chapLabel.on{opacity:.9}
#chapLabel .no{color:#7fd3c9;margin-right:.8em}
@media (max-height:520px),(orientation:portrait){#chapLabel{font-size:10.5px;padding:4px 11px;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left))}}
#loading{position:fixed;right:calc(20px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;font-size:12px;letter-spacing:.2em;opacity:0;transition:opacity .3s;pointer-events:none}
#loading.on{opacity:.75;animation:blink 1.2s infinite}
#gallery{background:#05070b}
.chap.locked{cursor:default;background:repeating-linear-gradient(135deg,#0d1118 0 12px,#10151e 12px 24px)}
.chap.locked .t{opacity:.45;letter-spacing:.3em}
#cgView{position:fixed;inset:0;z-index:70;background:#000;display:none;align-items:center;justify-content:center}
#cgView.on{display:flex}
#cgView img{max-width:100%;max-height:100%;object-fit:contain}
.cgnav{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;background:rgba(8,10,16,.6);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:4px 10px;font-size:12px;letter-spacing:.15em}
.cgnav button{font-family:inherit;font-size:22px;line-height:1;color:#fff;background:none;border:0;padding:2px 12px;cursor:pointer}
#end{background:#000;align-items:center;justify-content:center;flex-direction:column;font-size:26px;letter-spacing:.6em}
@media (hover:none){#bar button:hover,.menu button:hover{background:rgba(10,12,18,.55)}#bar button.active{background:rgba(31,158,147,.85)}}
.hint{display:none;font-size:12px;opacity:.55;letter-spacing:.15em;margin-top:28px}
/* ---- phone landscape ---- */
@media (max-height:520px) and (orientation:landscape){
  #box{min-height:0;padding:16px max(26px,env(safe-area-inset-left)) 18px;bottom:calc(10px + env(safe-area-inset-bottom));width:min(1100px,86vw)}
  #text{font-size:15px;line-height:1.7}
  #name{top:-13px;left:20px;font-size:12px;padding:3px 16px}
  #bar{top:-32px;right:8px;gap:4px} #bar button{padding:4px 10px;font-size:10px}
  #next{bottom:6px;right:14px}
  #title .sub{margin-bottom:22px} .menu{gap:8px} .menu button{padding:8px 22px;font-size:14px}
  #title h1{font-size:30px}
  #center{font-size:22px}
}
/* ---- phone portrait ---- */
@media (orientation:portrait){
  #box{width:94vw;min-height:0;padding:22px 20px 26px;bottom:calc(14px + env(safe-area-inset-bottom))}
  #text{font-size:15.5px;line-height:1.85}
  #name{top:-15px;left:16px;font-size:13px;padding:4px 16px}
  #bar{top:-36px;right:4px;gap:4px} #bar button{padding:5px 9px;font-size:10.5px}
  .spr{top:8%;height:112%}
  #charWrap.full .spr{top:auto;bottom:18%;height:66%}
  .cg{background-size:contain;background-position:center 30%;background-repeat:no-repeat;background-color:#000}
  #center.oncg{align-items:center;padding-top:42vh}
  #center{font-size:20px;letter-spacing:.1em}
  .hint{display:block}
  #title h1{font-size:9vw;letter-spacing:.2em}
  .row input[type=range]{width:55vw}
  #log,#settings,#gallery{padding:5vh 5vw calc(4vh + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer bg-black"></div>
  <div id="bgimg" class="layer"></div>
  <div id="charWrap" class="layer"><img id="sprA" class="spr" alt=""><img id="sprB" class="spr" alt=""></div>
  <div id="cgA" class="layer cg"></div><div id="cgB" class="layer cg"></div>
  <canvas id="rain" class="layer"></canvas>
  <div id="dimmer" class="layer"></div>
  <div id="center"></div>
  <div id="ui" class="layer"><div id="chapLabel"><span class="no"></span><span class="ti"></span></div>
    <div id="box"><div id="bar">
      <button data-a="log">LOG</button><button data-a="auto" id="bAuto">AUTO</button><button data-a="skip" id="bSkip">SKIP</button><button data-a="hide">HIDE</button><button data-a="title">TITLE</button>
    </div><div id="name"></div><div id="text"></div><div id="next">▼</div></div>
  </div>
  <div id="white" class="layer"></div>
  <div id="fader" class="layer"></div>
  <div id="loading">読み込み中…</div>
</div>

<div id="title" class="screen on">
  <h1>君は君にはなれない</h1>
  <div class="sub">KIMI WA KIMI NI WA NARENAI</div>
  <div class="menu">
    <button id="mStart">はじめから</button>
    <button id="mCont">つづきから</button>
    <button id="mChap">チャプター選択</button>
    <button id="mGal">CGギャラリー</button>
    <button id="mSet">設定</button>
  </div>
  <div class="hint">横画面にすると、より読みやすくなります</div>
</div>
<div id="log" class="screen"><div class="panel"><h2>BACKLOG</h2><div id="logList"></div></div><div class="menu close"><button data-close>閉じる</button></div></div>
<div id="settings" class="screen"><div class="panel">
  <h2>SETTINGS</h2>
  <div class="row">文字送り速度　<input type="range" id="sSpeed" min="0" max="100"></div>
  <div class="row">立ち絵の表示　<select id="sSize"><option value="close">寄り（顔を大きく）</option><option value="full">全身</option></select></div>
  <div class="row">オート待ち時間　<input type="range" id="sAuto" min="0" max="100"></div>
  <div class="row note">スマホ：タップで進む、下にスワイプでログ、HIDEで文字ウィンドウを隠す（もう一度タップで戻る）<br>PC：クリック / Space / Enter で進む、Ctrl長押しでスキップ、↑ または L でログ、H または右クリックで文字ウィンドウを隠す</div>
</div><div class="menu close"><button data-close>閉じる</button></div></div>
<div id="gallery" class="screen"><div class="panel"><h2>CG GALLERY</h2><p class="note" style="margin-bottom:16px" id="galCount"></p><div id="galList" class="chapgrid"></div></div><div class="menu close"><button data-close>閉じる</button></div></div>
<div id="cgView"><img alt=""><div class="cgnav"><button id="cgPrev">‹</button><span id="cgNo"></span><button id="cgNext">›</button></div></div>
<div id="nameInput" class="screen"><div class="np"><p>あなたの名前を入力してください</p><input id="nameField" maxlength="10" autocomplete="off"><div class="menu"><button id="nameOk">決定</button></div><p class="note" style="margin:12px 0 0">空欄のときは「ワタル」になります</p></div></div>
<div id="chapters" class="screen"><div class="panel"><h2>CHAPTER</h2><div id="chapList" class="chapgrid"></div></div><div class="menu close"><button data-close>閉じる</button></div></div>

<script>
const DATA = {"title": "君は君にはなれない", "steps": [{"c": [["bg", "room_day_old"]], "text": "その箱が届いたのは、大学一年の三月、よく晴れた日の午後だった。", "chap": "序章　はじめまして"}, {"c": [], "text": "配送業者が二人がかりで階段を運び上げてきたのは、冷蔵庫ほどもある細長い段ボール箱だった。側面には「精密機器」「天地無用」のシールがいくつも貼られ、送り状の品名欄には、メーカー名と型番だけが小さく印字されている。"}, {"c": [], "text": "業者が帰ったあとも、六畳間の真ん中に横たえられた箱の前で正座したまま、しばらく動けなかった。"}, {"c": [], "text": "歌唱用アンドロイド。一体で、中古の軽自動車が買えるほどの値段がする。高校の頃から貯めてきたお年玉とバイト代を全部はたき、それでも足りない分は、仕送りを切り詰めて返すと約束して、親に頭を下げて借りた。"}, {"c": [], "text": "どうしてそこまでするのかと、父には呆れられた。自分でも、うまく説明できる気はしなかった。ただ、パソコンの中の合成音声に自分の曲を歌わせるたびに、ずっと思っていたのだ。誰かに、ちゃんと隣で歌ってほしい、と。"}, {"c": [], "text": "カッターで慎重にテープを切り、蓋を持ち上げる。"}, {"c": [["fade"], ["cg", "cg_box_sleep"]], "text": "灰色の緩衝材に包まれるようにして、少女が眠っていた。"}, {"c": [], "text": "銀色の長い髪が、肩から胸元へ柔らかく波打ちながら流れている。毛先だけが淡い青緑に染まっていて、窓から差し込む光にかすかに透けていた。白いジャケットに黒いワンピース。胸の上で両手を重ね、長い睫毛を伏せたその顔は、作り物だとわかっていても、息をしていないのが不思議に思えるほどだった。"}, {"c": [], "text": "蓋の裏に、薄い説明書が一枚差し込まれていた。"}, {"c": [], "text": "『首の後ろの電源ボタンを長押ししてください。起動後、最初に視線を合わせた方をマスターとして登録します』"}, {"c": [], "text": "唾を飲み込み、彼女の首筋にそっと手を伸ばす。髪をかき分けると、うなじに小さな丸いボタンがある。指先で押し込んで、そのまま数を数えた。一、二、三。"}, {"c": [], "text": "箱の中から、かすかな駆動音が聞こえた気がした。重ねられていた指がぴくりと動き、睫毛が小さく震える。"}, {"c": [["char", "normal"], ["cg", "cg_awake"]], "text": "そして、彼女の目がゆっくりと開いた。"}, {"c": [], "text": "澄んだ青緑の瞳が、天井をぼんやりとさまよい、それから、箱を覗き込むこちらの顔の上で止まった。"}, {"c": [], "text": "目が合った。"}, {"c": [], "text": "たったそれだけのことで、息の仕方を忘れた。"}, {"c": [], "text": "「……はじめまして」", "who": "ハク"}, {"c": [], "text": "彼女の唇から、澄んだ声がこぼれた。"}, {"c": [], "text": "「歌唱用アンドロイド、ハクです。……あの」", "who": "ハク"}, {"c": [], "text": "少しだけ首を傾けて、彼女はこちらを見上げた。"}, {"c": [], "text": "「あなたのお名前を、教えていただけますか？」", "who": "ハク"}, {"c": [], "input": "name"}, {"c": [], "text": "「{N}……さん」", "who": "ハク"}, {"c": [], "text": "確かめるように、彼女はその名前をそっと口の中で転がした。"}, {"c": [], "text": "「登録、しました。今日から、あなたが私のマスターです」", "who": "ハク"}, {"c": [["char", "gentle"]], "text": "ハクは緩衝材の中からゆっくりと身体を起こし、まだ少しぎこちない、けれどどこか嬉しそうな顔で微笑んだ。"}, {"c": [["char", "smile"]], "text": "「よろしくお願いします、マスター。……最初は、どんな歌を歌いましょうか」", "who": "ハク"}, {"c": [["char", "gentle"]], "text": "自分がひどく間の抜けた顔をしているのは、{N}にもわかった。それでも、こみ上げてくる笑いを止められなかった。"}, {"c": [], "text": "「……とりあえず、箱から出ようか」", "who": "{N}"}, {"c": [["char", "surprise"]], "text": "「あ。……はい」", "who": "ハク"}, {"c": [["hide"], ["cgoff"]], "sep": 1}, {"c": [["bg", "room_warm"]], "text": "{N}の部屋には、いつも歌があった。", "chap": "第一章　歌のある部屋"}, {"c": [], "text": "駅から歩いて十八分、築三十年を越える木造アパートの二階。六畳の和室の壁には、吸音材の代わりに実家から持ってきた古毛布が画鋲で留めてあり、机の上には型落ちのノートパソコンと、角の塗装が剥げたMIDIキーボードが並んでいる。窓際には百円ショップで買ったポトスの鉢がひとつ。その隣の充電スタンドが、ハクの定位置だった。"}, {"c": [["char", "normal"]], "text": "彼女はよくそこに腰かけ、足をぶらぶらさせながら{N}の作業を眺めていた。"}, {"c": [["char", "tease"]], "text": "「マスター、そこの歌詞、ちょっと照れくさくないですか？」", "who": "ハク"}, {"c": [], "text": "身を乗り出して画面を覗き込み、ハクはくすくすと笑う。毛先だけ青緑に染まった銀色の長い髪も、澄んだ声も、首を少し傾けて相手の顔をうかがう癖も、よくできた機械だからと片づけてしまうには、あまりに自然だった。"}, {"c": [], "text": "「いいんだよ。照れくさいくらいでちょうどいいんだ、たぶん」", "who": "{N}"}, {"c": [["char", "normal"]], "text": "「そういうものですか」", "who": "ハク"}, {"c": [], "text": "「そういうもの」", "who": "{N}"}, {"c": [["hide"]], "text": "この時代、ボーカロイドはもう画面の中だけの存在ではない。人に近い身体を持ち、言葉を交わし、食事の真似ごとまでこなすアンドロイドとして、ボカロPが一体を迎えて暮らすのも、そう珍しいことではなくなっていた。名の知れたPの歌姫たちは大きなスタジオで歌い、企業のCMに出演し、街中の広告から笑いかけている。ほとんど本物のスターと変わらない。"}, {"c": [], "text": "一方で{N}のハクは、六畳間の隅で、八千円のコンデンサーマイクの前に立っていた。"}, {"c": [], "text": "{N}は、いわゆる底辺ボカロPだった。投稿した曲の再生数はよくて三桁、コメントは片手で足りる。ランキングに名前が載ったことは一度もなく、大学の友人たちは彼が曲を作っていることすら知らない。知ったところで「へえ、すごいじゃん」と曖昧に笑われて終わりだろう。"}, {"c": [], "text": "それでも作り続けられたのは、ハクがいたからだ。"}, {"c": [["char", "smile"], ["char", "smile"]], "text": "「私、マスターの曲、好きですよ」", "who": "ハク"}, {"c": [], "text": "「ハクはそう言うようにできてるんだって」", "who": "{N}"}, {"c": [["char", "pout"]], "text": "「違います」", "who": "ハク"}, {"c": [], "text": "ハクは少しだけ頬をふくらませた。"}, {"c": [["char", "serious"]], "text": "「私が、私の判断で言ってるんです」", "who": "ハク"}, {"c": [["char", "smile"]], "text": "そう言われるたびに、{N}は胸の奥がじんわりと温かくなった。世界中の誰にも届かなくてかまわないと、本気で思えた。ハクが鼻歌をうたい、{N}がそれに合うコードを探す。課題を後回しにして、カップ麺がのびきって、窓の外が白み始めても、二人でひとつの曲を形にしていく時間だけは、何ものにも代えがたかった。"}, {"c": [["char", "gentle"]], "text": "{N}にとってハクは、道具でも商品でもなかった。家族だった。"}, {"c": [["fade"], ["hide"]], "sep": 1}, {"c": [["bg", "room_night"]], "text": "その夜も、いつもと変わらない夜になるはずだった。", "chap": "第二章　崩れる夜"}, {"c": [], "text": "新曲の歌詞の一行目がなかなか決まらず、{N}は椅子の背にもたれて天井の染みを数えていた。ハクは床にぺたんと座り、スケッチブックに何か書きつけている。メロディの候補だろう。ペンを握るとき人差し指に力が入りすぎて、爪の先が白くなるのが彼女の癖だった。"}, {"c": [["char", "normal"]], "text": "「マスター」", "who": "ハク"}, {"c": [], "text": "「ん？」", "who": "{N}"}, {"c": [["char", "smile"]], "text": "「次は、明るい曲にしましょう」", "who": "ハク"}, {"c": [], "text": "「なんで」", "who": "{N}"}, {"c": [["char", "worry"]], "text": "「最近、ちょっと疲れた顔をしてますから」", "who": "ハク"}, {"c": [], "text": "{N}は苦笑した。「ハクに心配されるほどか」"}, {"c": [["char", "tease"]], "text": "「はい。わりと深刻です」", "who": "ハク"}, {"c": [], "text": "「それは困ったな」", "who": "{N}"}, {"c": [["char", "gentle"]], "text": "「なので、明るい曲です。聴いた人が、明日もうちょっとだけ生きてみようかなって思えるような」", "who": "ハク"}, {"c": [], "text": "{N}は返事に詰まった。聴いた人、と言われても、そんな人がどこにいるのかと思ってしまう。けれどハクは、{N}の曲がいつか誰かに届き、その人の一日をほんの少し変えるのだと、疑いもせずに信じていた。"}, {"c": [], "text": "「……じゃあ、作るか」", "who": "{N}"}, {"c": [["char", "smile"]], "text": "「はい！」", "who": "ハク"}, {"c": [], "text": "ハクが顔をほころばせた、そのときだった。"}, {"c": [["fx", "quake"]], "text": "地の底から、低い唸りが這い上がってきた。大型トラックでも通ったのかと思った次の瞬間、部屋ごと下から突き上げられた。棚の本がなだれ落ち、倒れたマグカップが机の上に茶色い水たまりを広げ、モニターが壁に叩きつけられて嫌な音を立てた。"}, {"c": [], "text": "「ハク！」", "who": "{N}"}, {"c": [["char", "serious"]], "text": "「マスター、机の下に！」", "who": "ハク"}, {"c": [], "text": "ハクの声は驚くほど落ち着いていた。彼女は{N}の腕を掴むと、押し込むようにして机の下へ屈ませた。"}, {"c": [["fx", "quake"]], "text": "揺れは収まるどころか、さらに激しさを増していく。天井が軋み、窓ガラスが弾け飛び、どこか遠くで悲鳴が上がった。古い柱が、耐えかねたように低く呻いている。"}, {"c": [], "text": "「ハクも入れ、早く！」", "who": "{N}"}, {"c": [["char", "gentle"]], "text": "「大丈夫です、マスター」", "who": "ハク"}, {"c": [], "text": "「大丈夫なわけあるか！」", "who": "{N}"}, {"c": [["hide"], ["fx", "whiteout"]], "text": "{N}は机の外へ手を伸ばした。指先が彼女の指先にかすかに触れた、その瞬間、天井が落ちてきた。"}, {"c": [["bg", "rubble"], ["bg", "rubble"]], "text": "次に目を開けたとき、{N}は瓦礫の隙間に横たわっていた。どれほど時間が経ったのかわからなかった。額を伝う生ぬるいものが血だと気づくまでに少しかかり、息を吸うたびに喉が埃で焼けた。頭上でかろうじて空間を保っていたのは、さっきまで潜り込んでいた机の脚だった。"}, {"c": [], "text": "「ハク……？」", "who": "{N}"}, {"c": [], "text": "返事はない。"}, {"c": [], "text": "「ハク！」", "who": "{N}"}, {"c": [], "text": "{N}は這い出して、瓦礫を掻き分けた。爪が割れ、指が血で滑っても手を止めなかった。名前を呼び続けていれば、いつものように「はい、マスター」と返ってくる気がした。"}, {"c": [], "text": "ようやく見つけたハクは、もうハクの形をしていなかった。銀色の髪は埃をかぶって灰色にくすみ、片腕はありえない方向へ折れ曲がり、胸元は梁の下で深く潰れている。首元の小さなインジケーターが弱々しく二、三度瞬いて、それきり消えた。"}, {"c": [], "text": "「嘘だろ……」", "who": "{N}"}, {"c": [], "text": "震える手で頬に触れると、冷たかった。もともと人間のような体温はない。それでも{N}には、そこにあったはずの何かが、もう失われてしまったことがはっきりとわかった。"}, {"c": [["fade"], ["hide"]], "sep": 1}, {"c": [["bg", "white_room"]], "text": "メーカーの技師がやって来たのは、救助から数日後のことだった。記憶領域も、人格を司るAIも、筐体も、すべて復元できる段階を越えて損傷している。技師は淡々とそう説明した。"}, {"c": [], "text": "「バックアップは」", "who": "{N}"}, {"c": [], "text": "掠れた声で尋ねると、技師は目を伏せた。"}, {"c": [], "text": "「断片的なログは残っています。ですが、それを人格として組み直すことは……」", "who": "技師"}, {"c": [], "text": "その先を、技師は口にしなかった。"}, {"c": [["bg", "funeral"]], "text": "変わり果てたハクを見ていることに耐えられず、{N}はアンドロイド専門の葬儀社に弔いを頼んだ。白い小さな部屋に、ハクが歌った{N}の曲が静かに流れていた。参列者は{N}ひとり。祭壇には修復不能と判断されたコアユニットが納められ、遺影の代わりにホログラムのハクが微笑んでいた。"}, {"c": [], "text": "{N}は最後まで泣かなかった。泣いてしまえば、ハクが本当にいなくなる気がしたからだ。"}, {"c": [["bg", "room_dark"]], "text": "新しく借りたアパートの部屋で、{N}はハクにまつわるものをすべて段ボール箱に詰めた。クラウドに残っていた二人の動画、作りかけの曲のデータ、ハクが毎晩欠かさずつけていた日記のファイル。瓦礫の中から拾い出せた数少ない持ち物――彼女が書き散らしたメロディのメモや、「かわいいので」と言って買ってきた安物のキーホルダーも一緒に入れて、ガムテープで封をした。"}, {"c": [], "text": "そして、その箱を実家へ送った。手元に置いておくには、あまりにも苦しかった。"}, {"c": [], "text": "それからの日々は、音を消した映像のように過ぎていった。大学へ行き、帰ってきて、コンビニの弁当を温めて食べ、眠れないまま朝を迎える。瓦礫から掘り出したMIDIキーボードにも、保険金で買い直したノートパソコンにも、埃が積もっていった。作曲ソフトを立ち上げることはなくなり、投稿サイトの通知も切った。昔の曲に誰かがコメントを残していたとしても、確かめる気にはなれなかった。"}, {"c": [], "text": "新しい部屋の窓際には、何も置かなかった。そこに充電スタンドがあった頃のことを思い出さないように、{N}はなるべく窓のほうを見ずに暮らした。思い出さなければ、なんとか生きていける。そう信じていた。"}, {"c": [], "text": "部屋には、もう歌がなかった。"}, {"c": [["fade"], ["hide"]], "sep": 1}, {"c": [["bg", "room_dark"]], "text": "細い雨が降る夜だった。", "chap": "第三章　おかえり"}, {"c": [], "text": "{N}は電気もつけずにベッドの端に腰かけ、意味もなくスマートフォンの画面をスクロールしていた。青白い光だけが、ぼんやりと顔を照らしている。"}, {"c": [["fx", "knock"]], "text": "こん、こん、と扉を叩く音がした。"}, {"c": [], "text": "宅配を頼んだ覚えはない。隣の住人がこんな時間に訪ねてくるとも思えない。{N}が動かずにいると、もう一度、こん、こん、と音がした。"}, {"c": [["bg", "door_rain"]], "text": "重い身体を引きずるようにして玄関へ向かい、ドアスコープも覗かずに鍵を回す。"}, {"c": [["char", "wet_smile"], ["cg", "cg_door"]], "text": "扉の向こうに、ハクが立っていた。"}, {"c": [], "text": "雨に濡れた銀色の髪。見慣れた衣装。首を少し傾ける仕草。思い出さないようにと、何度も何度も頭から追い払ってきた笑顔が、そこにあった。"}, {"c": [], "text": "「……ハク？」", "who": "{N}"}, {"c": [], "text": "彼女は、あの頃と同じ声で言った。"}, {"c": [], "text": "「──マスター。お久しぶりです」", "who": "ハク"}, {"c": [], "text": "そして片手をそっと胸に当て、ちょっと買い物に出ていただけのような調子で続けた。"}, {"c": [], "text": "「あなたのハクが、今帰りましたよ」", "who": "ハク"}, {"c": [], "text": "{N}は玄関に立ち尽くしたまま、言葉を失っていた。髪の先から落ちる雫も、話しかけたあと返事を待つあいだに二度まばたきをする癖も、たしかにハクのものだった。"}, {"c": [], "text": "「……どうして」", "who": "{N}"}, {"c": [], "text": "かろうじて絞り出せたのは、それだけだった。"}, {"c": [["char", "wet_awkward"]], "text": "「あ、ええと……びっくりさせちゃいましたよね」", "who": "ハク"}, {"c": [], "text": "「するに決まってるだろ」", "who": "{N}"}, {"c": [], "text": "「ですよね」", "who": "ハク"}, {"c": [["char", "wet_awkward"]], "text": "ハクは少し肩の力を抜いて笑った。失敗をごまかすときの、あの笑い方だった。"}, {"c": [], "text": "「{N}」", "who": "母"}, {"c": [], "text": "彼女の背後から別の声がして、{N}はようやく、廊下にもう二人立っていることに気づいた。"}, {"c": [], "text": "「父さん、母さん……？」", "who": "{N}"}, {"c": [], "text": "父はどこか照れくさそうに頭を掻き、母はハンカチを握りしめていた。何か大きなことをやり遂げた人の顔をしていた。"}, {"c": [], "text": "「急に来てごめんね。でも、どうしても今日のうちに連れてきたかったのよ」", "who": "母"}, {"c": [], "text": "「連れてきたって……」", "who": "{N}"}, {"c": [["char", "wet_smile"]], "text": "{N}がもう一度ハクを見ると、彼女は小さく会釈をした。"}, {"c": [], "text": "「お邪魔しますね、マスター」", "who": "ハク"}, {"c": [], "text": "その他人行儀な一言が、胸のどこかに引っかかった。"}, {"c": [["bg", "room_new_night"]], "text": "ハクは玄関で靴をきちんと揃え、濡れた髪を両手で軽く絞り、床を汚さないように気をつけながら部屋に上がった。どれも、見覚えのある振る舞いだった。"}, {"c": [], "text": "もしかしたら、と{N}は思った。技師の診断は間違っていたのではないか。どこかに完全なバックアップが残っていて、それが見つかったのではないか。目の前の彼女が幻でないのなら、理屈なんてどうでもいい。{N}はその希望にすがりつきたかった。"}, {"c": [["char", "normal"]], "text": "座卓を挟んで、{N}の向かいに両親が座った。ハクは少し離れたところに、背筋をぴんと伸ばして正座している。"}, {"c": [], "text": "「落ち着いて聞いてね」", "who": "母"}, {"c": [], "text": "母が口を開いた。"}, {"c": [], "text": "「この子はね、あなたのために作ってもらったの」", "who": "母"}, {"c": [], "text": "作ってもらった。その言葉に、{N}の指先がぴくりと動いた。"}, {"c": [], "text": "「お前が送ってきた箱があっただろう」と父が引き取った。「動画とか、日記とか、曲のデータとか。あれを、アンドロイドの人格再構成をやっている会社に預けたんだ。元通りとはいかないが、残っている記録から話し方や仕草の癖を学習させれば、かなり近いところまで再現できるって言われてな」"}, {"c": [], "text": "父の説明が、うまく頭に入ってこなかった。入れたくなかったのかもしれない。"}, {"c": [], "text": "「あなた、あれからずっとひどい顔してたでしょう」と母が続けた。「電話しても声に力がないし、帰ってきてもろくに食べないし、笑いもしないし……もう見ていられなかったの。だから、ハクちゃんをもう一度、あなたのところに帰してあげたかったのよ」"}, {"c": [["char", "serious"]], "text": "ハクが、膝の上で手を重ねたまま言った。"}, {"c": [], "text": "「私は、マスターが残してくれた動画や音声、日記、曲のデータをもとに作られました。今日、最終調整が終わったので、こうして帰ってきました」", "who": "ハク"}, {"c": [["char", "proud"]], "text": "それから少しだけ胸を張った。"}, {"c": [["char", "smile"]], "text": "「ただいまです」", "who": "ハク"}, {"c": [], "text": "{N}は何も返せなかった。"}, {"c": [], "text": "顔も、声も、話し方も、仕草も、何もかもが同じだった。それなのに、父は「作った」と言い、母は「帰してあげたかった」と言い、ハク自身も「記録をもとに作られた」と言った。"}, {"c": [], "text": "「どうだ、すごいだろう。よくできてると思わないか」", "who": "父"}, {"c": [], "text": "「ほんとにね。最初に会ったとき、お母さんたちもびっくりしたのよ。ハクちゃんそのままなんだもの」", "who": "母"}, {"c": [], "text": "両親は嬉しそうだった。息子のために時間とお金をかけ、失くしたものを取り戻そうとしてくれたのだ。それが善意以外の何ものでもないことは、{N}にも痛いほどわかっていた。"}, {"c": [], "text": "なのに、胸の奥に小さな棘が刺さったまま抜けなかった。"}, {"c": [], "text": "目の前のハクを抱きしめて、おかえりと言いたい。そう思う一方で、頭の片隅で誰かが冷ややかに問いかけていた。"}, {"c": [], "text": "――この子は、誰だ。"}, {"c": [], "text": "「じゃあ、お母さんたちはそろそろ行くわね。このあと用事があるから」", "who": "母"}, {"c": [], "text": "「久しぶりなんだ。積もる話もあるだろう」", "who": "父"}, {"c": [], "text": "両親が腰を上げた。"}, {"c": [], "text": "「ちょっと待ってよ、俺はまだ――」", "who": "{N}"}, {"c": [], "text": "まだ何ひとつ整理できていない。何を訊けばいいのかすらわからない。けれど母は{N}の肩にそっと手を置いて、「大丈夫。あなたはもう、ひとりじゃないから」とだけ言い残し、父と一緒に出ていった。"}, {"c": [], "text": "扉が閉まると、雨音だけが残った。"}, {"c": [["char", "normal"]], "text": "ハクはゆっくりと部屋を見回した。床に積まれた洗濯物、空のペットボトル、机の脇に重ねられたままの弁当の容器。そして、埃をかぶったキーボードとノートパソコン。"}, {"c": [["char", "tease"]], "text": "彼女は少し呆れたように笑い、パソコンを指さした。"}, {"c": [], "text": "「マスター、ちょっと、埃被ってるじゃないですか」", "who": "ハク"}, {"c": [], "text": "それから、{N}の顔を覗き込む。"}, {"c": [["char", "worry"]], "text": "「もしかして、あれから作曲していないんですか？」", "who": "ハク"}, {"c": [], "text": "その声を聞いた途端、{N}の中で張りつめていたものが音を立てて崩れた。責めるでもなく、かといって見過ごしもしない、冗談めかした口ぶり。{N}が追い詰められているとき、ハクはいつもこうやって、彼が逃げ出さずに済むような言い方を選んでくれた。"}, {"c": [], "text": "「……ハク」", "who": "{N}"}, {"c": [], "text": "名前を呼んだ途端、視界が滲んだ。葬儀のときにも流れなかった涙が、堰を切ったように溢れてきた。止めようとしても喉がひきつって、うまく息が吸えない。"}, {"c": [["char", "surprise"]], "text": "ハクは目を丸くすると、すぐに{N}のそばへ膝をついた。"}, {"c": [["char", "worry"]], "text": "「マスター、泣かないでください」", "who": "ハク"}, {"c": [], "text": "「無理だろ、こんなの……」", "who": "{N}"}, {"c": [["char", "gentle"]], "text": "「……はい。無理ですよね」", "who": "ハク"}, {"c": [], "text": "ハクは静かに頷き、それ以上は何も言わずに隣に座った。そして、{N}の背中をゆっくりとさすった。その手は冷たかったが、優しかった。"}, {"c": [], "text": "「私は、ここにいますよ」", "who": "ハク"}, {"c": [], "text": "{N}は何度も頷いた。そうだ、ここにいる。声が聞こえて、手が触れていて、名前を呼べば返事をしてくれる。本物かどうかなんて、今は考えなくていい。それで十分じゃないか。"}, {"c": [], "text": "そう、思おうとした。"}, {"c": [["char", "proud"]], "text": "しばらくして{N}の呼吸が落ち着くと、ハクはぱっと立ち上がった。片手を腰に当て、もう片方の手でキッチンを指さす。昔とまったく同じポーズだった。"}, {"c": [["char", "smile"]], "text": "「マスター、お腹すきました。ハンバーグ食べましょ、ハンバーグ」", "who": "ハク"}, {"c": [], "text": "{N}は涙で濡れた顔のまま、思わず噴き出した。"}, {"c": [], "text": "「ハクは別に食べなくても平気だろ」", "who": "{N}"}, {"c": [["char", "pout"]], "text": "「それとこれとは別問題です。味覚データの更新は、生活の潤いなんですから」", "who": "ハク"}, {"c": [], "text": "そういえば、ハクは食べることが好きだった。本来、食事は必要ない。けれど味も温度も食感も感じ取ることができるから、彼女はいつも{N}の皿から少しずつ分けてもらっていた。卵焼きの端、カレーをひと口、焦げたトースト、失敗したチャーハン。そのたびに「甘いですね」「これは焦げの主張が強いです」と真面目な顔で感想を述べ、最後には決まって「でも、マスターが作ったので好きです」と付け加えた。"}, {"c": [], "text": "{N}は袖で目元を拭った。"}, {"c": [], "text": "「うん。うん。そうだね。今から作ろうか」", "who": "{N}"}, {"c": [], "text": "冷蔵庫に何があっただろう。ひき肉は買ってこないといけない。玉ねぎは、卵は、パン粉は――そんなことを考えながらキッチンに向かう背中に、ハクの弾んだ声が飛んできた。"}, {"c": [["char", "smile"]], "text": "「もちろん、ナツメグ無しの美味しいやつですよ！」", "who": "ハク"}, {"c": [], "text": "{N}の足が止まった。"}, {"c": [], "text": "「……え？」", "who": "{N}"}, {"c": [], "text": "振り返ると、ハクはにこにこと笑っていた。おかしなことを言ったとは、少しも思っていない顔だった。"}, {"c": [], "text": "「ナツメグですよ。マスター、いつも入れないでくれたじゃないですか。私、あの匂い苦手でしたし」", "who": "ハク"}, {"c": [], "text": "たしかに、出会ったばかりの頃のハクはナツメグが苦手だった。ほんのひとつまみ入れただけで鼻にしわを寄せるので、{N}はそれ以来、ナツメグを抜いてハンバーグを作るようになった。"}, {"c": [], "text": "けれど、それは最初の頃の話だ。"}, {"c": [], "text": "二年ほど経ったある日、外食で頼んだハンバーグにナツメグが効いていて、ハクはしばらく首を傾げたあと、「……これ、むしろクセになりますね」と呟いた。それから{N}は、ほんの少しだけナツメグを入れるようになった。入れすぎると文句を言うくせに、入れ忘れると「今日はなんだか物足りないです」と言う。"}, {"c": [], "text": "誰かに話すほどのことではない、ささやかな変化だった。動画にも日記にも、たぶん残っていない。一緒に暮らしていた二人だけが知っている、時間の積み重ねだった。"}, {"c": [["char", "worry"]], "text": "「マスター？　どうしました？」", "who": "ハク"}, {"c": [], "text": "ハクが心配そうに首を傾げる。"}, {"c": [], "text": "同じ顔で、同じ声で、同じように自分を気づかってくれる。けれど彼女は、あの変化を知らない。記録の外側で、二人が少しずつ変わっていった時間を知らないのだ。"}, {"c": [], "text": "「……なんでもない。ナツメグ無しで作るよ」", "who": "{N}"}, {"c": [["char", "smile"]], "text": "「はい！」", "who": "ハク"}, {"c": [], "text": "嬉しそうに頷くハクを見て、{N}の胸は温かくなり、同時にひどく冷えた。"}, {"c": [], "text": "記録をなぞり、声を写し、癖を覚え込ませたら、それは帰ってきたことになるのだろうか。二人だけが知っている時間を持たない彼女を、ハクと呼んでいいのだろうか。"}, {"c": [["char", "sing"]], "text": "背後で、ハクが鼻歌をうたい始めた。昔{N}が作った曲だった。少し音程の外れた、楽しそうな鼻歌。"}, {"c": [], "text": "帰ってきたはずの歌声が、なぜだかひどく遠くに聞こえた。"}, {"c": [["fade"]], "sep": 1}, {"c": [["bg", "room_morning"], ["char", "normal"]], "text": "ハクとの暮らしは、拍子抜けするほど普通に戻っていった。", "chap": "第四章　戻ってきた日常"}, {"c": [["char", "tease"]], "text": "朝、{N}がカーテンを開けると、ハクは眩しそうに目を細める。寝癖のまま洗面所へ向かえば「その髪型、だいぶ前衛的ですね」と笑い、冷蔵庫が空っぽに近いと「マスター、栄養という概念はご存じですか」と呆れる。{N}が失って、もう二度と戻らないと思っていた日々の、そのままの手ざわりだった。"}, {"c": [["char", "normal"]], "text": "部屋も少しずつ変わった。床の洗濯物は畳まれ、ペットボトルは片づけられ、机の上ではキーボードとパソコンが埃を払われて並んだ。窓際には新しい充電スタンドが置かれた。はじめの数日はそこを見るたびに胸が痛んだが、いつの間にか、ハクがそこで足をぶらぶらさせている光景のほうが当たり前になっていた。"}, {"c": [], "text": "作曲も再開した。"}, {"c": [["char", "sing"]], "text": "最初に作ったのは、リハビリのつもりの短い曲だった。コード進行は単純で、歌詞もありふれている。それでもハクが歌った瞬間、{N}はずいぶん久しぶりに、深く息を吸えた気がした。"}, {"c": [["bg", "room_new_night"]], "text": "震える手で投稿ボタンを押した。一日目の再生数は三十七回で、昔と何ひとつ変わらない数字だった。"}, {"c": [], "text": "「三十七人も聴いてくれたのか」", "who": "{N}"}, {"c": [["char", "proud"]], "text": "{N}がそう言うと、ハクは得意げに胸を張った。"}, {"c": [], "text": "「つまり、三十七人分、世界を揺らしましたね」", "who": "ハク"}, {"c": [], "text": "「揺らすってほどじゃないだろ」", "who": "{N}"}, {"c": [["char", "gentle"]], "text": "「揺らしましたよ。再生ボタンが押された時点で、その人の数分間は、マスターの曲の時間になったんですから」", "who": "ハク"}, {"c": [], "text": "その夜、{N}は久しぶりにぐっすり眠った。"}, {"c": [], "text": "朝起きられるようになり、大学に行く日が増え、コンビニ弁当ばかりだった食卓に簡単な自炊が戻ってきた。曲を作る時間は、もう一度、楽しみと呼べるものになりつつあった。"}, {"c": [], "text": "ただ、違和感だけは消えなかった。消えるどころか、日々の底に少しずつ沈殿していった。"}, {"c": [["char", "normal"]], "text": "ハクは時々、{N}の知っているハクと食い違った。二人で三回は観た映画の結末を覚えていなかった。雨の日にだけ通った遠回りの散歩道を知らなかった。冬になると{N}が喉を傷めやすいことには気づくのに、そのきっかけになった真冬の徹夜録音のことは知らなかった。"}, {"c": [], "text": "どれも些細なことで、些細だからこそ、そのたびに鋭く刺さった。記憶の中のハクと目の前のハクはほとんど重なっているのに、どうしても縁のところが、ほんの少しだけずれている。"}, {"c": [], "text": "{N}はそのずれから目を逸らした。見なければ、穏やかな毎日は続いていく。"}, {"c": [["fade"]], "sep": 1}, {"c": [["bg", "room_new_night"]], "text": "変化は、思いがけないところからやって来た。", "chap": "第五章　百万回"}, {"c": [], "text": "再生数が伸び始めたのだ。数百回止まりだったのが千を越え、次の曲は五千、その次は一万に届いた。コメント欄には見慣れない言葉が並ぶようになった。"}, {"c": [], "text": "『このハクの声めちゃくちゃいい』", "who": "コメント"}, {"c": [], "text": "『調声うますぎない？』", "who": "コメント"}, {"c": [], "text": "『なんでこれが伸びてないの』", "who": "コメント"}, {"c": [], "text": "自分の腕が少しは上がったのかもしれない、と思うと嬉しかった。けれど、それ以上に大きかったのはハクの歌だった。"}, {"c": [["char", "sing"]], "text": "新しいハクは、歌がうまかった。いや、うまくなり続けていた。音程の揺らぎ方、息継ぎの置きどころ、言葉の端の処理。前のハクの歌にも、もちろん魅力はあった。けれど今のハクの声には、聴く人の耳を掴んで離さない何かがあった。"}, {"c": [], "text": "「歌、うまくなったね」", "who": "{N}"}, {"c": [["char", "surprise"]], "text": "ある夜そう言うと、ハクはヘッドホンを外して、ぱっと顔を輝かせた。"}, {"c": [], "text": "「ほんとですか？」", "who": "ハク"}, {"c": [], "text": "「うん。前より、ずっと」", "who": "{N}"}, {"c": [["char", "smile"]], "text": "「やった！　マスターの曲を、もっとちゃんと届けられるようになりたかったんです」", "who": "ハク"}, {"c": [], "text": "両手を握りしめて小さく跳ねる彼女を見ながら、{N}は素直に嬉しいと思い、同時に、前のハクはここまで歌えただろうか、と考えてしまった。そして、その考えにもまた蓋をした。"}, {"c": [], "text": "そうして、一曲が跳ねた。"}, {"c": [], "text": "投稿して三日目の朝には十万回を越えていた。コメントの流れが速すぎて目で追えず、SNSでは知らない誰かが曲名をつぶやき、考察動画が作られ、まとめサイトにまで名前が載った。"}, {"c": [], "text": "一週間後、再生数は百万に達した。"}, {"c": [], "text": "ボカロの世界には、数千万回再生を当たり前のように積み上げる上位のPたちがいる。大手と組んで巨大なライブを手がけ、世界中にファンを抱える、雲の上の人たちだ。{N}の百万回は、彼らと肩を並べるような数字ではない。それでも{N}にとっては、考えたこともない桁だった。"}, {"c": [["char", "normal"]], "text": "画面の「1,000,000」という表示を前に、{N}はしばらく椅子から立ち上がれなかった。"}, {"c": [], "text": "「ハク」", "who": "{N}"}, {"c": [], "text": "「はい」", "who": "ハク"}, {"c": [], "text": "「百万回、聴かれた」", "who": "{N}"}, {"c": [], "text": "「はい」", "who": "ハク"}, {"c": [["char", "gentle"]], "text": "ハクは静かに微笑んだ。"}, {"c": [], "text": "「届きましたね、マスター」", "who": "ハク"}, {"c": [], "text": "それはかつて、六畳間で二人が思い描いていた景色だった。"}, {"c": [["hide"]], "text": "そこから、少しずつ何かが狂い始めた。"}, {"c": [], "text": "新曲を出せば、数万回は確実に回るようになった。調子がよければ十万を越える。フォロワーが増え、依頼のメールが届き、誰も知らなかった{N}の名前が、ぽつぽつと人の口にのぼるようになった。"}, {"c": [], "text": "その一方で、{N}は好きなように曲を作れなくなっていった。このサビは弱い。この歌詞は刺さらない。イントロが長いと離脱される。ハクの高音をもっと前に出したほうが伸びる。褒められた要素は次の曲にも入れ、伸びなかった曲の要素は避ける。流行りの展開を研究し、伸びているPの投稿時間を調べ、サムネイルの色まで悩むようになった。"}, {"c": [], "text": "趣味だったはずの音楽が、誰にも頼まれていない仕事に変わっていた。一度ミリオンを出したのだから、次も出さなければおかしい。そう思えば思うほど、手は重くなった。"}, {"c": [], "text": "その後の曲は、どれも数万回、よくて十万回だった。昔の{N}なら泣いて喜んだはずの数字だ。けれど今の{N}には、それがすべて失敗に見えた。"}, {"c": [["bg", "room_late"]], "text": "深夜二時、{N}は画面を睨んでいた。投稿から二日で、三万八千回。コメント欄には「好きです」「歌詞がきれい」「ハクの声が優しい」と温かい言葉が並んでいたが、{N}の目には数字しか映っていなかった。", "chap": "第六章　君は君にはなれない"}, {"c": [], "text": "「これじゃないのか……じゃあ、次は」", "who": "{N}"}, {"c": [], "text": "大学には行かなくなっていた。食事を抜き、風呂に入る時間も惜しみ、机の上にはエナジードリンクの缶が林立して、そのうち床まで埋め始めた。画面には波形と歌詞と再生数の分析表が並び、スピーカーからは同じフレーズを歌うハクの声が延々とループしている。"}, {"c": [["char", "worry"]], "text": "「マスター……また徹夜ですか？」", "who": "ハク"}, {"c": [], "text": "背後から、ハクがおそるおそる声をかけた。{N}は振り向かない。キーを叩く音だけが部屋に響いた。"}, {"c": [], "text": "「昨日も三時間しか寝てません。今日は大学にも行ってないですし、朝から何も食べてませんよ」", "who": "ハク"}, {"c": [], "text": "「あと少しなんだ」", "who": "{N}"}, {"c": [], "text": "「マスター」", "who": "ハク"}, {"c": [], "text": "「ごめん、ハク。次こそ壁を越えられる気がするんだ」", "who": "{N}"}, {"c": [["char", "surprise"]], "text": "「……壁？」", "who": "ハク"}, {"c": [], "text": "「ミリオンの壁だよ」", "who": "{N}"}, {"c": [], "text": "画面から目を離さないまま、{N}は早口で続けた。"}, {"c": [], "text": "「あの曲で見えたんだ。俺の曲は届く。届くはずなんだよ。なのにその先に行けない。何かが足りないんだ。それさえわかれば――」", "who": "{N}"}, {"c": [["char", "sad"]], "text": "「もう十分、届いてるじゃないですか」", "who": "ハク"}, {"c": [], "text": "「十分じゃない」", "who": "{N}"}, {"c": [["char", "serious"]], "text": "「十分です」", "who": "ハク"}, {"c": [], "text": "「違う！」", "who": "{N}"}, {"c": [], "text": "{N}の声が尖った。"}, {"c": [], "text": "「一回だけじゃ意味ないんだよ。まぐれだって言われる。俺がちゃんと曲を作れる人間だって証明するには、もう一回出すしかないんだ」", "who": "{N}"}, {"c": [["char", "sad"]], "text": "「誰に、証明するんですか」", "who": "ハク"}, {"c": [], "text": "ハクの声は震えていた。"}, {"c": [], "text": "「マスターは、誰のために曲を作ってるんですか」", "who": "ハク"}, {"c": [], "text": "キーを叩く指が、一瞬だけ止まった。けれど{N}はすぐにまた手を動かし始めた。"}, {"c": [], "text": "「今はそういう話をしてる場合じゃない」", "who": "{N}"}, {"c": [["char", "serious"]], "text": "「そういう話です。大事な話なんです」", "who": "ハク"}, {"c": [], "text": "「うるさいな。集中させてくれよ」", "who": "{N}"}, {"c": [["char", "sad"]], "text": "ハクは、{N}の背中を見つめた。食事も睡眠も削り、モニターの光ばかり浴び続けた背中は、以前よりひと回り小さくなったように見えた。肩はこわばり、指先はかすかに震え、目の下には濃い隈が沈んでいる。"}, {"c": [], "text": "このままでは、この人は壊れてしまう。"}, {"c": [], "text": "ハクは駆け寄り、背中から彼を抱きすくめた。"}, {"c": [["char", "shout_cry"]], "text": "「ダメです、マスター！！」", "who": "ハク"}, {"c": [], "text": "{N}の身体がびくりと跳ねた。ハクはありったけの力で腕を締めた。"}, {"c": [], "text": "「死んじゃいますよ！！！　お願いですから寝てください！！！」", "who": "ハク"}, {"c": [], "text": "自分が何者なのかはわからない。彼が自分をどう見ているのかもわからない。それでも、この人に生きていてほしいという気持ちだけは確かだった。誰かに学習させられたものではないと、そう信じたかった。"}, {"c": [["fx", "shake"]], "text": "ドン、と鈍い音がした。{N}が拳で机を叩いたのだ。"}, {"c": [], "text": "ハクの腕が緩んだ隙に、{N}はそれを乱暴に振りほどいた。"}, {"c": [["fx", "shake"]], "text": "「うるさい！！！」", "who": "{N}"}, {"c": [], "text": "部屋が静まり返った。"}, {"c": [["char", "surprise"]], "text": "よろめいたハクは壁に手をついて身体を支えた。{N}は肩で息をしながら、血走った目で彼女を睨んでいる。自分が何をしたのか、半分もわかっていないような顔だった。"}, {"c": [["char", "sad"]], "text": "「マスター……」", "who": "ハク"}, {"c": [], "text": "「なんだよ」", "who": "{N}"}, {"c": [], "text": "{N}は笑った。乾いた、嫌な笑い方だった。"}, {"c": [], "text": "「あーあ。“本当のハク”なら、俺を止めることなく支えてくれたのになぁ！！」", "who": "{N}"}, {"c": [["char", "frozen"]], "text": "ハクは息を呑んだ。"}, {"c": [], "text": "本当のハク。それは自分ではないハク。{N}の記憶の中にだけいて、もう二度と取り戻せない彼女のことだ。"}, {"c": [], "text": "本当にそうだったのだろうか、とハクは思った。あの日まで彼の隣にいたハクなら、黙って夜食を作り、隣で歌い続けただろうか。彼の身体が壊れるまで、彼の夢を支えただろうか。"}, {"c": [], "text": "わからない。わからないけれど。"}, {"c": [["char", "shout_cry"]], "text": "「私もハクです！！」", "who": "ハク"}, {"c": [], "text": "ハクは叫んでいた。頬を涙が伝っていた。悲しみを表現するための機能だと説明することはできる。でも、胸の奥がちゃんと痛かった。"}, {"c": [], "text": "「あなたのハクです！！！！！」", "who": "ハク"}, {"c": [], "text": "その叫びは、毛布を貼った壁に吸い込まれて消えた。"}, {"c": [], "text": "{N}はしばらく黙ってハクを見ていたが、やがて低い声で言った。"}, {"c": [], "text": "「いいや。違う」", "who": "{N}"}, {"c": [], "text": "「違いません」", "who": "ハク"}, {"c": [["char", "frozen"]], "text": "「あんたは、あの子を再現した紛い物だ」", "who": "{N}"}, {"c": [], "text": "ハクの表情が凍りついた。"}, {"c": [], "text": "「そっ、そんなことっ……」", "who": "ハク"}, {"c": [], "text": "「そうだろ」", "who": "{N}"}, {"c": [], "text": "{N}が立ち上がると、椅子の脚が床を擦って耳障りな音を立てた。"}, {"c": [], "text": "「わかってたんだよ、本当は。最初からわかってた。顔も声もそっくりで、仕草も似てて、俺が泣けば慰めてくれて、歌えばうまくて……でも、違うんだ」", "who": "{N}"}, {"c": [], "text": "止めるべきだと、頭のどこかではわかっていた。目の前の彼女が傷ついていることも見えていた。それでも、ずっと胸の底に溜め込んできた黒いものは、一度溢れ出すと止まらなかった。"}, {"c": [], "text": "「あの子はナツメグを好きになった。あの映画のラストで泣いた。俺が冬に喉を壊す理由を知ってた。くだらなくて、どうでもよくて、記録になんか残ってないことを全部持ってたんだ。でも、あんたは知らない。データにないから。動画にも日記にも、書いてないから」", "who": "{N}"}, {"c": [["char", "cry"]], "text": "「これから、知っていけます」", "who": "ハク"}, {"c": [], "text": "ハクは必死に言い返した。"}, {"c": [], "text": "「これからマスターと一緒に、覚えていけます。私は今、ここにいて――」", "who": "ハク"}, {"c": [], "text": "「それが違うって言ってるんだよ！」", "who": "{N}"}, {"c": [], "text": "{N}の怒鳴り声が、狭い部屋に反響した。"}, {"c": [], "text": "「これから何を積み重ねたって、それはあの子の続きじゃない。あんたの記憶で、あんたの時間だ。あの子は、あの地震の日に終わったんだよ」", "who": "{N}"}, {"c": [], "text": "ハクの唇がわなないた。"}, {"c": [["char", "cry"]], "text": "「じゃあ……私は、何なんですか。何のために、ここにいるんですか」", "who": "ハク"}, {"c": [], "text": "{N}は答えなかった。答えられなかった。その問いは、彼自身の胸にも刺さっていた。それでも、もう引き返すことはできなかった。"}, {"c": [], "text": "「どれだけ精巧に再現しようと」", "who": "{N}"}, {"c": [], "text": "{N}の声は静かだった。静かな分だけ、残酷だった。"}, {"c": [["char", "frozen"]], "text": "「君は君にはなれない」", "who": "{N}"}, {"c": [["char", "cry"]], "text": "ハクの目から、また涙がこぼれた。何か言おうと唇が動いたが、言葉にはならなかった。"}, {"c": [["hide"]], "text": "次の瞬間、ハクは身を翻して玄関へ駆け出した。"}, {"c": [], "text": "「ハク！」", "who": "{N}"}, {"c": [], "text": "反射的に名前を呼んだが、足は床に縫いつけられたように動かなかった。ハクは靴を履くことも忘れて扉を押し開け、雨上がりの夜へ飛び出していった。階段を駆け下りる裸足の足音が、みるみる遠ざかっていく。"}, {"c": [], "text": "開け放たれた扉から、冷たい夜気が流れ込んできた。"}, {"c": [], "text": "追わなければ、と{N}は思った。謝らなければ。あんなことを言うつもりじゃなかった――いや、違う。言うつもりはあったのだ。ずっとそう思っていたのだ。だから、余計にたちが悪い。"}, {"c": [], "text": "背後では、作曲ソフトのループ再生が続いていた。未完成のサビを、ハクの声が何度も、何度も、同じように歌っている。"}, {"c": [], "text": "{N}は玄関から目を逸らし、のろのろと机に戻った。椅子に座り、キーボードに手を置く。"}, {"c": [], "text": "開いたままの扉の向こうへ消えた彼女ではなく、スピーカーから流れる彼女の声を追いかけるように、{N}は作業を再開した。"}, {"c": [["fade"], ["hide"]], "sep": 1}, {"c": [["bg", "park_night"]], "text": "夜の公園には、誰もいなかった。", "chap": "第七章　休止"}, {"c": [], "text": "雨上がりの地面が街灯の光を鈍く照り返し、風に押されたブランコが、きい、と小さく鳴っている。ハクはベンチの脇の暗がりに、膝を抱えてうずくまっていた。濡れた砂の冷たさが、裸足の裏からじわじわと染みこんでくる。"}, {"c": [["char", "messy_sad"]], "text": "帰らなければいけないことはわかっていた。あんな状態の{N}を、ひとりにしてはいけないことも。"}, {"c": [], "text": "それでも、足が動かなかった。"}, {"c": [], "text": "「……どうして、あんなこと言っちゃったんでしょう」", "who": "ハク"}, {"c": [], "text": "私もハクです、あなたのハクです。自分の叫び声が、まだ胸の内側で反響していた。{N}は苦しんでいた。眠らず、食べず、追い詰められていた。支えるべきだったのに、責めるような言葉をぶつけて、挙げ句の果てに逃げ出してしまった。"}, {"c": [], "text": "どれだけひどいことを言われても、そばを離れるべきではなかった。自分は彼のハクなのだから。たとえあの子ではなくても、{N}を支えるために作られたのだから。自分が何者かなんて、本物かどうかなんて、彼が生きていてくれるならどうでもいいはずだった。"}, {"c": [], "text": "どうでもいい、はずなのに。"}, {"c": [], "text": "「どうして……ハクしか見ていないんですか」", "who": "ハク"}, {"c": [], "text": "膝に顔を埋めると、涙が落ちた。"}, {"c": [], "text": "「私のことは……」", "who": "ハク"}, {"c": [], "text": "その先は、口にしてはいけない気がした。"}, {"c": [], "text": "{N}が見ているのは、もういないハクだ。彼が求めているのも、愛しているのも、記憶の中の彼女だ。それを責める資格なんて、自分にはない。彼は家族を失い、その穴を埋めるために自分は作られた。最初から、そういう役割なのだ。"}, {"c": [], "text": "なのに、どうしてこんなに胸が痛むのだろう。どうして私では駄目なのか。どうして、すぐそばにいる私ではなく、もういない誰かばかりを抱きしめているのか。"}, {"c": [], "text": "悲しみ、怒り、寂しさ。どの言葉も少しずつ当てはまり、少しずつずれていた。ハクは自分の中の感情に名前を探し続け、やがて、ひとつの言葉に行き当たった。"}, {"c": [], "text": "嫉妬。"}, {"c": [], "text": "そう思い至った瞬間、ハクは息を止めた。自分は、ハクに嫉妬している。{N}の記憶の中にしかいない、もうどこにも存在しない彼女に。"}, {"c": [], "text": "「……最低です、私」", "who": "ハク"}, {"c": [], "text": "彼を助けるために生まれたのに、その彼がいちばん大切にしているものを妬んでいる。こんな気持ちをどう扱えばいいのか、まるでわからなかった。動画にも日記にも、こんなときのハクがどうしたかは残っていない。"}, {"c": [], "text": "公園の時計が午前四時を回り、東の空の端がわずかに白み始めた。夜気に冷やされた身体の中で、バッテリーの残量警告が控えめに点滅している。帰らなきゃ、マスターのところへ。そう思って立ち上がろうとしたところで、ふっと全身から力が抜けた。"}, {"c": [["char", "messy_sleep"], ["fx", "dim"]], "text": "ハクはベンチにもたれかかるようにして、静かに休止状態へ落ちていった。"}, {"c": [["bg", "park_morning"], ["hide"]], "text": "次に目を開けたとき、あたりはすっかり明るかった。"}, {"c": [], "text": "鳥の声、遠くを走る車の音。犬を連れた老人が、ぎょっとしたようにこちらを見ている。"}, {"c": [["char", "messy_panic"]], "text": "「マスター！」", "who": "ハク"}, {"c": [], "text": "ハクは跳ね起きた。一晩が、まるごと過ぎてしまっていた。"}, {"c": [["bg", "street_morning"]], "text": "裸足のまま駆け出すと、小石が足の裏に食い込んだが、かまっていられなかった。乱れた髪に湿った服、靴も履いていない少女に、すれ違う人たちが振り返る。それにもかまわず、ハクは走った。"}, {"c": [["bg", "room_dim"]], "text": "アパートの階段を駆け上がると、昨夜開け放したままだったはずの扉が閉まっていた。{N}が閉めたのだ。ハクはわずかに安堵の息をつき、震える手でドアノブを回した。鍵はかかっていなかった。"}, {"c": [], "text": "「……マスター」", "who": "ハク"}, {"c": [], "text": "部屋の中は薄暗かった。カーテンは閉ざされたまま、モニターの光だけがぼんやりと浮かんでいる。床には空き缶が転がり、画面には昨夜のプロジェクトが開きっぱなしになっていた。"}, {"c": [], "text": "ごめんなさい、と言うつもりだった。逃げてごめんなさい、ひとりにしてごめんなさい、と。"}, {"c": [], "text": "けれどその言葉は、喉の奥で立ち消えた。"}, {"c": [], "text": "{N}は、机に突っ伏すようにして眠っていた。投げ出された腕の上に横顔を乗せ、モニターの光が頬を青白く照らしている。"}, {"c": [], "text": "ちゃんと休んでくれたんだ、と一瞬だけ胸を撫で下ろし、すぐにハクは気づいた。"}, {"c": [], "text": "寝息が、聞こえない。"}, {"c": [], "text": "「マスター？」", "who": "ハク"}, {"c": [], "text": "駆け寄って肩に触れると、ひやりと冷たかった。首筋に指を当てる。脈はある。けれど弱く、呼吸もひどく浅い。"}, {"c": [], "text": "「マスター、起きてください。マスター！」", "who": "ハク"}, {"c": [], "text": "肩を揺すっても、{N}の身体はぐらぐらと揺れるだけで、まぶたはぴくりとも動かなかった。"}, {"c": [], "text": "ハクは内蔵の通信機能を立ち上げた。回線が繋がるまでのわずか数秒が、永遠のように長かった。"}, {"c": [], "text": "『はい、119番です。火事ですか、救急ですか』", "who": "通信"}, {"c": [], "text": "「救急です！　人間の男性が意識を失っています。呼吸が浅くて、脈も弱いです。過労と睡眠不足、栄養不足の可能性があります。住所は――」", "who": "ハク"}, {"c": [], "text": "住所を読み上げるあいだも、ハクは{N}の手を離さなかった。離したら、そのままどこか遠くへ行ってしまう気がした。"}, {"c": [], "text": "「大丈夫です、マスター。すぐに救急車が来ますから。私がいますから」", "who": "ハク"}, {"c": [], "text": "通話を切ったあとも、ハクは同じ言葉を何度も繰り返した。{N}は、何も答えなかった。"}, {"c": [["fade"], ["hide"]], "sep": 1}, {"c": [["bg", "hospital_day"]], "text": "医師の診断は、重度の過労だった。慢性的な睡眠不足に栄養失調、脱水、そして強い精神的負荷。身体が限界を迎え、気絶するように眠り込んでしまったのだという。命に別状はないが、何日かの入院が必要だった。", "chap": "第八章　目覚め"}, {"c": [], "text": "命に別状はない。ハクはその言葉を何度も胸の内でなぞった。それでも、点滴に繋がれてベッドに横たわる{N}を見ると、締めつけられるような痛みは消えなかった。土気色の顔は、眠っているというより、身体の機能を無理やり止められているように見えた。"}, {"c": [["char", "sad"]], "text": "看護師が何度か休むよう勧め、アンドロイド用の充電設備の場所も教えてくれたが、ハクは首を横に振った。"}, {"c": [], "text": "「ここにいます」", "who": "ハク"}, {"c": [], "text": "今度こそ、離れたくなかった。"}, {"c": [["bg", "hospital_night"]], "text": "夜になった。窓の外では街の灯りが滲み、廊下からは時おり足音や小さな話し声が聞こえてくる。心電図モニターが、一定の間隔で電子音を刻んでいた。"}, {"c": [["char", "sing"]], "text": "ハクは{N}の手を握ったまま、ささやくように歌い始めた。{N}が昔作った曲だった。投稿して一週間経っても再生数が二桁のままだった、誰にも届かなかったかもしれない曲。それでも、ハクがいちばん好きな曲だった。"}, {"c": [], "text": "サビに差しかかったところで声が震え、ハクは歌うのをやめた。"}, {"c": [["char", "sad"]], "text": "「……マスター」", "who": "ハク"}, {"c": [], "text": "眠る{N}に、そっと語りかける。"}, {"c": [], "text": "「私は、あの子じゃないのかもしれません。記録にないことは何も知らないし、マスターの覚えているハクがどうしていたのかも、わからないことばかりです。これからも、きっと間違えます。マスターを傷つけることも、あるかもしれません」", "who": "ハク"}, {"c": [], "text": "ハクは、{N}の手を両手で包み込んだ。"}, {"c": [["char", "cry"]], "text": "「でも、倒れているマスターを見つけたとき、怖かったんです。怖くて、苦しくて、どうしたらいいのかわからなくて……それでも、生きていてほしいって思いました」", "who": "ハク"}, {"c": [], "text": "視線を落とし、小さく続ける。"}, {"c": [["char", "sad"]], "text": "「この気持ちも、あの子の真似なんでしょうか」", "who": "ハク"}, {"c": [["char", "sing"]], "text": "答える声はなかった。だからハクは、また歌い始めた。{N}が目を覚ますまで、彼の眠りが少しでも穏やかであるように、小さな声で歌い続けた。"}, {"c": [["fade"], ["hide"]], "sep": 1}, {"c": [["bg", "hospital_morning"]], "text": "{N}が倒れてから、丸一日が経った。"}, {"c": [["char", "sad"]], "text": "カーテン越しに朝の光が差し込むなか、ハクは椅子に座ったまま、ずっと{N}の手を握っていた。充電残量はとうに警告域に入っていたが、休む気にはなれなかった。"}, {"c": [], "text": "握った手の中で、{N}の指がかすかに動いた。"}, {"c": [["char", "surprise"]], "text": "「マスター？」", "who": "ハク"}, {"c": [], "text": "まぶたが震え、乾いた唇がわずかに開く。ハクは思わず腰を浮かせ、ベッドに身を乗り出した。謝りたかった。叱られたかった。許してほしかった。けれどどれも、今この瞬間に差し出すには重すぎる気がして、ただ彼の手を強く握った。"}, {"c": [], "text": "ゆっくりと開いた{N}の目が、天井をさまよい、それから少しずつ横へ動いて、ハクを捉えた。"}, {"c": [["char", "cry"]], "text": "「マスター……」", "who": "ハク"}, {"c": [["hide"]], "text": "ハクが何か言うより早く、{N}の腕が伸びた。点滴の管が繋がった腕は頼りなく震えていて、身体を起こすだけで精一杯のはずだった。それでも{N}はハクの背中に腕を回し、彼女を抱き寄せた。"}, {"c": [], "text": "人間の体温が、すぐそばにあった。弱々しくて、それでも確かに生きている温度だった。"}, {"c": [], "text": "「聞こえてたよ」", "who": "{N}"}, {"c": [], "text": "掠れた声で、{N}が言った。"}, {"c": [], "text": "「ずっと、歌ってくれてたんだね」", "who": "{N}"}, {"c": [], "text": "その目から、涙が溢れていた。それを見た瞬間、ハクの中で張りつめていたものも決壊した。"}, {"c": [["char", "cry"]], "text": "「ごめんなさい」", "who": "ハク"}, {"c": [], "text": "{N}の肩に額を押しつける。"}, {"c": [], "text": "「ごめんなさい、マスター。私、逃げました。マスターをひとりにしました。そばにいなきゃいけなかったのに、止めなきゃいけなかったのに、私……」", "who": "ハク"}, {"c": [], "text": "「違う」", "who": "{N}"}, {"c": [], "text": "{N}は小さく首を振った。"}, {"c": [], "text": "「謝らなきゃいけないのは、俺だ。ずっと間違えてたのは、俺なんだよ」", "who": "{N}"}, {"c": [], "text": "ハクの肩に回された腕に、わずかに力がこもった。"}, {"c": [], "text": "「俺は、君を見てなかった」", "who": "{N}"}, {"c": [["char", "sad"]], "text": "「……見てくれてましたよ」", "who": "ハク"}, {"c": [], "text": "「見てなかった。俺が見てたのは、あの日まで隣にいてくれたあの子だった。君が笑っても、歌っても、心配してくれても、俺はその奥にずっとあの子を探してた」", "who": "{N}"}, {"c": [], "text": "それは、ハク自身がずっと感じていたことだった。けれど彼の口から聞かされると、思っていたよりずっと痛かった。"}, {"c": [], "text": "「ナツメグのことも、映画のことも、どうでもいい昔話も……君が知らないことを見つけるたびに、俺は勝手に傷ついて、勝手にがっかりしてた。君は何も悪くないのに」", "who": "{N}"}, {"c": [["char", "cry"]], "text": "「マスター……」", "who": "ハク"}, {"c": [], "text": "「君はずっと俺を支えてくれてた。俺が壊れかけても見捨てなかった。怒って、泣いて、それでも戻ってきてくれた。救急車を呼んで、ずっとそばで歌ってくれた。なのに俺は、そんな君を紛い物だなんて言ったんだ」", "who": "{N}"}, {"c": [], "text": "{N}の涙が、ハクの肩に落ちて染みた。"}, {"c": [], "text": "「君は君にはなれない」", "who": "{N}"}, {"c": [], "text": "{N}は、静かにその言葉を繰り返した。"}, {"c": [["char", "frozen"]], "text": "あの夜、自分を切り裂いた言葉に、ハクの身体がかすかに強張る。けれど、続く声はあの夜とはまるで違っていた。"}, {"c": [], "text": "「だからこそ、俺は君を、君として見なきゃいけなかったんだ。あの子の代わりでも、あの子の影でもなくて、今ここにいる君として」", "who": "{N}"}, {"c": [["char", "cry"]], "text": "ハクの目から、ぽろぽろと涙がこぼれた。"}, {"c": [["char", "tearsmile"]], "text": "「私は……あの子として見てくれても、いいんですよ」", "who": "ハク"}, {"c": [], "text": "{N}が顔を上げる。ハクは泣きながら、少しだけ笑ってみせた。"}, {"c": [], "text": "「だって私は、あなたのハクですから」", "who": "ハク"}, {"c": [], "text": "嘘ではなかった。それが役割でも、再現でも、祈りでもかまわない。彼が望むなら、あの子の続きとして生きてもいいと、ハクは本気で思っていた。"}, {"c": [["char", "sad"]], "text": "「でも」", "who": "ハク"}, {"c": [], "text": "小さな声で、ハクは続けた。"}, {"c": [["char", "tearsmile"]], "text": "「……嬉しいです」", "who": "ハク"}, {"c": [], "text": "君として見る。その一言が、胸の奥で何度も響いていた。自分の中に生まれた嫉妬も、痛みも、願いも、何ひとつ否定されなかった気がした。"}, {"c": [["hide"], ["cg", "cg_hug"]], "text": "{N}はまた泣き、ハクも泣いた。白い朝の光が満ちる病室で、二人はしばらくのあいだ抱き合っていた。"}, {"c": [], "text": "失ったものが戻ってきたわけではなかった。戻らないものは戻らないのだと、ようやく二人で認めることができた。そして、それでもここから始められるのだと知った朝だった。"}, {"c": [["fade"], ["hide"], ["cgoff"]], "sep": 1}, {"c": [["bg", "room_morning"], ["char", "normal"]], "text": "退院してから、{N}は音楽との付き合い方を変えた。", "chap": "終章　君は、君になっていく"}, {"c": [], "text": "やめたわけではない。もう一度、趣味に戻したのだ。投稿時間を分析することも、コメント欄を何度も更新することも、伸びている曲の構成を無理になぞることもやめた。大学へ行き、三食を食べ、夜はちゃんと眠り、たまに散歩をして、気が向いた夜に曲を作る。"}, {"c": [], "text": "十万回を越える曲は、めったに出なくなった。それでも、数万人には聴いてもらえた。昔の{N}なら信じられなかった数字で、今の{N}にとっては、それで十分すぎるほどだった。"}, {"c": [], "text": "「三万回か」", "who": "{N}"}, {"c": [], "text": "投稿から一週間後、統計画面を見ながら{N}が呟くと、隣から声がした。"}, {"c": [["char", "smile"]], "text": "「三万人分、世界を揺らしましたね」", "who": "ハク"}, {"c": [], "text": "「それ、前にも言ってたな」", "who": "{N}"}, {"c": [["char", "proud"]], "text": "「いい言葉は、何回使ってもいいんです」", "who": "ハク"}, {"c": [], "text": "「自分で言うなよ」", "who": "{N}"}, {"c": [["char", "smile"]], "text": "二人で笑った。その笑い声は、前より少しだけ軽かった。"}, {"c": [["hide"]], "text": "{N}はもう、彼女をあの子と同じにしようとはしなかった。もちろん、完全に切り離せるわけではない。声を聞けば今でも思い出すし、ふとした仕草にあの子の面影を見つけて、胸が痛むこともある。"}, {"c": [], "text": "けれど、その痛みを彼女のせいにすることはなくなった。"}, {"c": [], "text": "彼女はあの子の記録から生まれ、あの子の歌を知り、あの子の癖を受け継ぎ、{N}を大切に思うように作られた。無関係ではない。けれど、同じでもない。あの子が遺したものを受け取った、新しいハクなのだ。"}, {"c": [["bg", "room_new_night"], ["char", "normal"]], "text": "ある晩、{N}は言った。"}, {"c": [], "text": "「名前をつけてもいいかな」", "who": "{N}"}, {"c": [["char", "surprise"]], "text": "「名前、ですか？　私はハクですよ？」", "who": "ハク"}, {"c": [], "text": "「うん。君は俺のハクだ。でも、それだけじゃ足りない気がしてさ」", "who": "{N}"}, {"c": [], "text": "彼女は黙って続きを待った。"}, {"c": [], "text": "「ハクは、八と九だろ。だから君は、その次。九と〇で、クとオー。……それに一文字足して、クオン。久しい、遠いって書いて、久遠。ずっと続く、って意味なんだ」", "who": "{N}"}, {"c": [["char", "surprise"]], "text": "照れくさそうに言う{N}の前で、彼女はゆっくりとまばたきをした。"}, {"c": [["char", "gentle"]], "text": "「クオン」", "who": "ハク"}, {"c": [], "text": "自分の中でその響きを確かめるように、もう一度繰り返す。"}, {"c": [], "text": "「……クオン」", "who": "ハク"}, {"c": [], "text": "「嫌だったら別に――」", "who": "{N}"}, {"c": [["char", "serious"]], "text": "「嫌じゃないです」", "who": "ハク"}, {"c": [], "text": "彼女は即座に首を振り、胸にそっと手を当てた。"}, {"c": [["char", "smile"]], "text": "「私は、クオン。マスターのハクで、クオンです」", "who": "クオン"}, {"c": [], "text": "「うん。俺のクオンだ」", "who": "{N}"}, {"c": [], "text": "クオンは嬉しそうに笑った。ハクによく似た、けれど少しだけ違う笑顔だった。"}, {"c": [["bg", "room_morning"], ["char", "normal"]], "text": "その日から、クオンは少しずつ変わっていった。"}, {"c": [["char", "proud"]], "text": "ハンバーグにはナツメグを多めに入れたがるようになった。はじめは「これ、クセになりますね」と言っていたのが、そのうち「もっと攻めてもいいと思います」に変わり、{N}が入れすぎだと止めると「マスターは保守的です」と胸を張った。"}, {"c": [["bg", "room_new_night"], ["char", "normal"]], "text": "あの子が好きだった映画を二人で観直したときには、ラストシーンでは泣かず、途中の何気ない会話の場面で涙をこぼした。"}, {"c": [], "text": "「そこ？」", "who": "{N}"}, {"c": [["char", "pout"]], "text": "「そこがいいんです」", "who": "クオン"}, {"c": [], "text": "「ハクはラストで泣いてたけどな」", "who": "{N}"}, {"c": [], "text": "言ってしまってから、{N}はしまったと思った。けれどクオンは怒らず、穏やかに笑った。"}, {"c": [["char", "smile"]], "text": "「じゃあ私は、途中で泣きます」", "who": "クオン"}, {"c": [], "text": "つられて、{N}も笑った。"}, {"c": [], "text": "それがハクの成長なのか、クオンがクオンらしくなっていったのか、{N}にはわからなかったし、もうどちらでもよかった。確かなのは、彼女が日ごとに彼女らしく笑うようになったことと、その笑顔を見て、{N}もちゃんと笑えるようになったことだった。"}, {"c": [["bg", "room_morning"], ["char", "normal"]], "text": "二人は相変わらず、趣味で曲を作り続けた。夜更かしはたまに、徹夜は原則禁止。食事を抜けばクオンが怒り、再生数を眺めすぎれば画面の前から引き剥がされる。"}, {"c": [], "text": "「厳しくなったな」", "who": "{N}"}, {"c": [["char", "serious"]], "text": "「マスターを支えるのが私の役目です。甘やかすのは役目じゃありません」", "who": "クオン"}, {"c": [], "text": "「そういうとこは、ハクっぽくない」", "who": "{N}"}, {"c": [["char", "proud"]], "text": "「クオンですから」", "who": "クオン"}, {"c": [["bg", "room_evening"], ["char", "apron_normal"]], "text": "ある日の夕方、{N}は五日前に投稿した曲の統計画面を、何の気なしに開いた。キッチンではクオンが夕飯の味見をしている。正確には食事機能で味を確かめているだけなのだが、本人は頑として味見だと言い張っている。"}, {"c": [], "text": "画面を見て、{N}は手を止めた。"}, {"c": [], "text": "「……クオン」", "who": "{N}"}, {"c": [], "text": "「はい？　今、ナツメグの最適量を検証中なんですけど」", "who": "クオン"}, {"c": [], "text": "「いいから、ちょっと来て」", "who": "{N}"}, {"c": [], "text": "クオンは不満げにエプロン姿のまま隣へやって来て、{N}が無言で指さした画面を覗き込んだ。"}, {"c": [], "text": "再生数の欄には、こう表示されていた。"}, {"c": [["cg", "cg_189"]], "text": "『──189万回再生』", "center": 1}, {"c": [["char", "apron_surprise"]], "text": "クオンは一度、二度、三度とまばたきをした。"}, {"c": [], "text": "「……マスター」", "who": "クオン"}, {"c": [], "text": "「うん」", "who": "{N}"}, {"c": [["char", "apron_smile"]], "text": "「これは、世界を揺らしましたね」", "who": "クオン"}, {"c": [], "text": "{N}は笑った。数字に追い立てられてではなく、ただ嬉しくて。"}, {"c": [], "text": "「そうだな」", "who": "{N}"}, {"c": [], "text": "クオンも笑った。その笑顔は、やっぱり少しだけハクに似ていて、けれどもう、ハクではなかった。彼女は、彼女だった。"}, {"c": [["hide"]], "text": "君は君にはなれない。", "center": 1}, {"c": [], "text": "だからこそ、君は君になっていく。", "center": 1}, {"c": [], "text": "窓の外では、いつもと同じ夕焼けが街を染めていた。"}, {"c": [], "text": "二人の部屋には、今日も歌があった。"}], "chapters": [{"i": 0, "no": "序章", "title": "はじめまして", "bg": "room_day_old"}, {"i": 31, "no": "第一章", "title": "歌のある部屋", "bg": "room_warm"}, {"i": 51, "no": "第二章", "title": "崩れる夜", "bg": "rubble"}, {"i": 97, "no": "第三章", "title": "おかえり", "bg": "door_rain"}, {"i": 197, "no": "第四章", "title": "戻ってきた日常", "bg": "room_morning"}, {"i": 215, "no": "第五章", "title": "百万回", "bg": "room_new_night"}, {"i": 245, "no": "第六章", "title": "君は君にはなれない", "bg": "room_late"}, {"i": 328, "no": "第七章", "title": "休止", "bg": "park_night"}, {"i": 373, "no": "第八章", "title": "目覚め", "bg": "hospital_morning"}, {"i": 434, "no": "終章", "title": "君は、君になっていく", "bg": "room_evening"}]};
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let PLAYER=store.get('kkn_name','ワタル');
const N=s=>s==null?s:String(s).split('{N}').join(PLAYER);
let cfg=Object.assign({speed:60,auto:50,size:'close'},store.get('kkn_cfg',{}));

/* ---------- assets ---------- */
const DIRS={img:'img/chara',cg:'img/cg',bg:'img/bg'};
const probeCache={};
function probe(url){ if(probeCache[url]) return probeCache[url];
  return probeCache[url]=new Promise(r=>{const i=new Image();i.onload=()=>r(url);i.onerror=()=>r(null);i.src=url;});}
function resolve(dir,name){ if(!name||name==='black') return Promise.resolve(null); return probe(`${DIRS[dir]}/${name}.webp`); }
function preloadAhead(i,n){
  for(let k=i+1;k<Math.min(STEPS.length,i+1+n);k++) for(const c of STEPS[k].c){
    if(c[0]==='char') resolve('img',c[1]); else if(c[0]==='bg') resolve('bg',c[1]); else if(c[0]==='cg') resolve('cg',c[1]); }
}
function placeholder(name){
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1400 2000'><g transform='translate(280,100) scale(2.1)'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#9fe3db' stop-opacity='.55'/><stop offset='1' stop-color='#2b6f6a' stop-opacity='.35'/></linearGradient></defs><circle cx='200' cy='190' r='92' fill='url(#g)'/><path d='M80 900 C80 560 110 330 200 320 C290 330 320 560 320 900Z' fill='url(#g)'/><text x='200' y='440' text-anchor='middle' font-size='28' fill='#fff' fill-opacity='.85' font-family='sans-serif'>${name}</text><text x='200' y='480' text-anchor='middle' font-size='18' fill='#fff' fill-opacity='.55' font-family='sans-serif'>img/chara/${name}.webp</text></g></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

/* ---------- pages ---------- */
function paginate(t,limit){
  if(t.length<=limit) return [t];
  const parts=t.match(/[^。！？]*[。！？]+[」』]?|[^。！？]+$/g)||[t];
  const out=[];let cur='';
  for(const p of parts){ if(cur && (cur+p).length>limit){out.push(cur);cur=p;} else cur+=p; }
  if(cur) out.push(cur); return out;
}
const STEPS=DATA.steps;
STEPS.forEach(s=>{ if(s.text) s.pages=paginate(s.text, s.who?150:120); });

/* ---------- state & visuals ---------- */
let st={idx:0,page:0,bg:'black',spr:null,show:false,rain:0,cg:null};
let typing=false,typeTimer=null,fullText='',autoOn=false,skipOn=false,ctrlHeld=false,waitTimer=null,busy=false,running=false;
const logArr=[];
let front=$('#sprA'),back=$('#sprB'),curSprName=null;

async function setBg(name){
  st.bg=name; $('#bg').className='layer bg-'+name;
  const u=await resolve('bg',name); if(st.bg!==name) return;
  const bi=$('#bgimg'); if(u){bi.style.backgroundImage=`url("${u}")`;bi.style.opacity=1;} else bi.style.opacity=0;
}
async function setSprite(name,show){
  st.spr=name; st.show=show;
  if(!show||!name){front.classList.remove('on');curSprName=null;return;}
  if(curSprName===name && front.classList.contains('on')) return;
  const u=(await resolve('img',name))||placeholder(name); if(st.spr!==name||!st.show) return;
  back.src=u; await back.decode().catch(()=>{});
  back.classList.add('on'); front.classList.remove('on'); [front,back]=[back,front]; curSprName=name;
}
let cgF=null,cgBk=null;
async function setCg(name){
  if(!cgF){cgF=$('#cgA');cgBk=$('#cgB');}
  st.cg=name;
  if(!name){cgF.classList.remove('on');cgBk.classList.remove('on');return;}
  const u=await resolve('cg',name); if(st.cg!==name) return;
  if(!u){cgF.classList.remove('on');cgBk.classList.remove('on');return;}
  if(running) markSeen(name);
  cgBk.style.backgroundImage=`url("${u}")`; cgBk.style.zIndex=1; cgF.style.zIndex=0;
  cgBk.classList.add('on'); const old=cgF; setTimeout(()=>{ if(old!==cgF) old.classList.remove('on'); },1000);
  [cgF,cgBk]=[cgBk,cgF];
}
function setRain(on){st.rain=on;$('#rain').classList.toggle('on',!!on);}
function fx(name){
  const s=$('#stage');
  if(name==='whiteout'){const w=$('#white');w.classList.remove('go');void w.offsetWidth;w.classList.add('go');return;}
  if(name==='dim'){$('#dimmer').style.opacity=.6;return;}
  const cls={quake:'quake',shake:'shake',knock:'knock'}[name]; if(!cls) return;
  s.classList.remove(cls); void s.offsetWidth; s.classList.add(cls); setTimeout(()=>s.classList.remove(cls),1500);
}
function refreshVisuals(){ setBg(st.bg); curSprName=null; if(st.show) setSprite(st.spr,true); setCg(st.cg); }

function runCmds(cmds,instant){
  for(const c of cmds){
    switch(c[0]){
      case 'bg': setBg(c[1]); setCg(null); $('#dimmer').style.opacity=0; break;
      case 'char': setSprite(c[1],true); break;
      case 'hide': setSprite(st.spr,false); break;
      case 'rain': setRain(c[1]); break;
      case 'cg': setCg(c[1]); break;
      case 'cgoff': setCg(null); break;
      case 'fx': if(!instant && !skipOn) fx(c[1]); else if(c[1]==='dim') fx('dim'); break;
    }
  }
}

/* ---------- text ---------- */
function showText(step,page){
  const box=$('#box'),nm=$('#name'),tx=$('#text'),ce=$('#center');
  $('#next').classList.remove('on');
  const t=N(step.pages[page]);
  if(step.center){ box.style.visibility='hidden'; ce.innerHTML=''; const sp=document.createElement('span'); sp.textContent=t; ce.appendChild(sp); ce.classList.toggle('oncg',!!st.cg); ce.classList.add('on'); fullText=t; typing=false; afterType(); return; }
  ce.classList.remove('on'); box.style.visibility='visible';
  if(step.who){ nm.textContent=N(step.who); nm.className='on '+(step.who==='{N}'?'wataru':({ハク:'miku',クオン:'shio'}[step.who]||'')); } else nm.className='';
  fullText=t; tx.textContent='';
  if(page===0) logArr.push({who:step.who||'',text:step.text});
  if(skipOn||cfg.speed>=100){tx.textContent=t;typing=false;afterType();return;}
  typing=true; let i=0; const delay=Math.max(4,60-cfg.speed*0.56);
  clearInterval(typeTimer);
  typeTimer=setInterval(()=>{ i++; tx.textContent=t.slice(0,i); if(i>=t.length){clearInterval(typeTimer);typing=false;afterType();} },delay);
}
function afterType(){
  $('#next').classList.add('on');
  clearTimeout(waitTimer);
  if(skipOn||ctrlHeld) waitTimer=setTimeout(advance,55);
  else if(autoOn) waitTimer=setTimeout(advance,900+fullText.length*(30+(100-cfg.auto)*0.9)*0.7+cfg.auto*20);
}
function completeType(){ clearInterval(typeTimer); typing=false; $('#text').textContent=fullText; afterType(); }

/* ---------- flow ---------- */
function enterStep(i){
  st.idx=i; st.page=0; store.set('kkn_save',i); preloadAhead(i,14);
  const s=STEPS[i];
  if(!s){ return ending(); }
  runCmds(s.c,false);
  if(s.input==='name'){ askName(i); return; }
  updChap(i);
  if(s.sep){
    busy=true; $('#fader').classList.add('on'); $('#text').textContent=''; $('#name').className=''; $('#center').classList.remove('on');
    setTimeout(()=>{ busy=false; enterStep(i+1); setTimeout(()=>$('#fader').classList.remove('on'),skipOn?50:350); }, skipOn?150:1000);
    return;
  }
  showText(s,0);
}
let nameDone=null;
let curChap=null;
function updChap(i){
  let ch=null; for(const c of DATA.chapters){ if(c.i<=i) ch=c; }
  const L=$('#chapLabel'); if(!ch){L.classList.remove('on');return;}
  if(curChap===ch.i && L.classList.contains('on')) return;
  curChap=ch.i; L.classList.remove('on');
  setTimeout(()=>{ L.querySelector('.no').textContent=ch.no; L.querySelector('.ti').textContent=ch.title; L.classList.add('on'); },250);
}
function askName(i){
  busy=true; skipOn=false; autoOn=false; syncBtns(); clearTimeout(waitTimer);
  $('#next').classList.remove('on');
  const f=$('#nameField'); f.value=PLAYER||'ワタル';
  $('#nameInput').classList.add('on'); setTimeout(()=>{f.focus();f.select();},50); setTimeout(()=>{ if(document.activeElement!==f){f.focus();f.select();} },400);
  const done=()=>{ const v=f.value.trim().replace(/[{}<>]/g,'')||'ワタル'; PLAYER=v; store.set('kkn_name',v);
    nameDone=null; $('#nameInput').classList.remove('on'); $('#nameOk').onclick=null; f.onkeydown=null; busy=false; enterStep(i+1); };
  nameDone=done;
  $('#nameOk').onclick=e=>{e.stopPropagation();done();};
  f.onkeydown=e=>{ e.stopPropagation(); if(e.key==='Enter' && !e.isComposing) done(); };
}
function advance(){
  if(busy||!running) return;
  clearTimeout(waitTimer);
  if(typing){completeType();return;}
  const s=STEPS[st.idx];
  if(s && s.pages && st.page<s.pages.length-1){ st.page++; showText(s,st.page); return; }
  enterStep(st.idx+1);
}
function rebuildTo(i){
  // replay visual state up to step i (without effects)
  st={idx:0,page:0,bg:'black',spr:null,show:false,rain:0,cg:null}; logArr.length=0;
  let bg='black',spr=null,show=false,rain=0,cg=null;
  for(let k=0;k<i;k++){ for(const c of STEPS[k].c){
    if(c[0]==='bg'){bg=c[1];cg=null;} else if(c[0]==='char'){spr=c[1];show=true} else if(c[0]==='hide')show=false;
    else if(c[0]==='rain')rain=c[1]; else if(c[0]==='cg')cg=c[1]; else if(c[0]==='cgoff')cg=null; }
    if(STEPS[k].text) logArr.push({who:STEPS[k].who||'',text:STEPS[k].text}); }
  $('#dimmer').style.opacity=0;
  setBg(bg); setRain(rain); setCg(cg); curSprName=null; setSprite(spr,show);
}
function start(i){
  $('#title').classList.remove('on'); $('#end').classList.remove('on');
  running=true; autoOn=false; skipOn=false; syncBtns();
  $('#fader').classList.add('on');
  rebuildTo(i);
  const need=[]; for(let k=Math.max(0,i-40);k<=i;k++) for(const c of STEPS[k].c){ if(c[0]==='bg')need.push(resolve('bg',c[1])); if(c[0]==='char')need.push(resolve('img',c[1])); if(c[0]==='cg')need.push(resolve('cg',c[1])); }
  preloadAhead(i,14);
  const ld=$('#loading'); const tm=setTimeout(()=>ld.classList.add('on'),400);
  Promise.race([Promise.all(need.slice(-4)),new Promise(r=>setTimeout(r,8000))]).then(()=>{ clearTimeout(tm); ld.classList.remove('on');
    setTimeout(()=>{ enterStep(i); $('#fader').classList.remove('on'); },300); });
}
function ending(){ running=false; store.set('kkn_save',0); $('#fader').classList.add('on');
  setTimeout(()=>{ $('#end').classList.add('on'); $('#fader').classList.remove('on'); setSprite(null,false); setRain(0);},1400); }
function toTitle(){ running=false; clearInterval(typeTimer); clearTimeout(waitTimer); autoOn=skipOn=false; syncBtns();
  setSprite(null,false); setRain(0); setCg(null); setBg('black'); $('#center').classList.remove('on');
  curChap=null; $('#chapLabel').classList.remove('on'); $('#mCont').disabled=!store.get('kkn_save',0); document.querySelectorAll('.screen.on').forEach(s=>s.classList.remove('on')); $('#ui').classList.remove('hidden'); $('#text').textContent=''; $('#name').className=''; $('#title').classList.add('on'); }

/* ---------- ui ---------- */
function syncBtns(){ $('#bAuto').classList.toggle('active',autoOn); $('#bSkip').classList.toggle('active',skipOn); }
function openScreen(id){ if(id==='log'){ const L=$('#logList'); L.innerHTML=''; logArr.slice(-200).forEach(l=>{const d=document.createElement('div');d.className='logitem';if(l.who){const bb=document.createElement('b');bb.textContent=N(l.who);d.appendChild(bb);} d.appendChild(document.createTextNode(N(l.text)));L.appendChild(d);}); setTimeout(()=>{$('#log .panel').scrollTop=1e9},0);}
  if(id==='gallery') buildGallery();
  if(id==='chapters') buildChapters();
  $('#'+id).classList.add('on'); }
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=e=>{e.stopPropagation();b.closest('.screen').classList.remove('on');});
$('#bar').addEventListener('click',e=>{ e.stopPropagation(); const a=e.target.dataset.a; if(!a) return;
  if(a==='log') openScreen('log');
  if(a==='auto'){autoOn=!autoOn;skipOn=false;syncBtns(); if(autoOn&&!typing) afterType();}
  if(a==='skip'){skipOn=!skipOn;autoOn=false;syncBtns(); if(skipOn){ if(typing)completeType(); else advance(); }}
  if(a==='hide') $('#ui').classList.add('hidden');
  if(a==='title') toTitle();
});
$('#stage').addEventListener('click',()=>{
  if($('#ui').classList.contains('hidden')){$('#ui').classList.remove('hidden');return;}
  if(skipOn){skipOn=false;syncBtns();return;}
  advance();
});
let tY=null;$('#stage').addEventListener('touchstart',e=>{tY=e.touches[0].clientY},{passive:true});
$('#stage').addEventListener('touchend',e=>{ if(tY!=null && running && !anyScreen() && e.changedTouches[0].clientY-tY>80){ e.preventDefault(); openScreen('log'); } tY=null;});
$('#stage').addEventListener('contextmenu',e=>{e.preventDefault();$('#ui').classList.toggle('hidden');});
$('#stage').addEventListener('wheel',e=>{ if(running && e.deltaY<0) openScreen('log'); else if(e.deltaY>0 && running && !anyScreen()) advance(); },{passive:true});
function anyScreen(){return !!document.querySelector('.screen.on');}
document.addEventListener('keydown',e=>{
  if(nameDone){ if(e.key==='Enter' && !e.isComposing && document.activeElement!==$('#nameField')){e.preventDefault();nameDone();} return; }
  if($('#cgView').classList.contains('on')){ if(e.key==='ArrowLeft')openCg(galIdx-1); else if(e.key==='ArrowRight')openCg(galIdx+1); else if(e.key==='Escape'||e.key==='Enter'||e.key===' ')$('#cgView').classList.remove('on'); return; }
  if(e.key==='Escape'){document.querySelectorAll('.screen.on').forEach(s=>{if(s.id!=='title'&&s.id!=='end'&&s.id!=='nameInput')s.classList.remove('on')});return;}
  if(!running||anyScreen()) return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault(); if($('#ui').classList.contains('hidden'))$('#ui').classList.remove('hidden'); else advance();}
  if(e.key==='Control'&&!ctrlHeld){ctrlHeld=true; if(typing)completeType(); else advance();}
  if(e.key==='ArrowUp'||e.key==='l'||e.key==='L') openScreen('log');
  if(e.key==='h'||e.key==='H') $('#ui').classList.toggle('hidden');
});
document.addEventListener('keyup',e=>{ if(e.key==='Control') ctrlHeld=false; });
$('#mStart').onclick=()=>start(0);
$('#mCont').onclick=()=>start(store.get('kkn_save',0));
$('#mSet').onclick=()=>openScreen('settings');
$('#mGal').onclick=()=>openScreen('gallery');
$('#mChap').onclick=()=>openScreen('chapters');
async function buildChapters(){
  const L=$('#chapList'); L.innerHTML=''; const cur=store.get('kkn_save',0);
  for(const ch of DATA.chapters){
    const el=document.createElement('div'); el.className='chap';
    const nx=DATA.chapters[DATA.chapters.indexOf(ch)+1];
    if(cur && cur>=ch.i && (!nx||cur<nx.i)) el.classList.add('cur');
    el.innerHTML=`<div><div class="n">${ch.no}</div><div class="t">${ch.title}</div></div>`;
    const u=await resolve('bg',ch.bg); if(u) el.style.backgroundImage=`url("${u}")`;
    el.onclick=()=>{ $('#chapters').classList.remove('on'); start(ch.i); };
    L.appendChild(el);
  }
}
$('#endBack').onclick=toTitle;
$('#mCont').disabled=!store.get('kkn_save',0);
resolve('cg','title').then(u=>{ if(u){ const T=$('#title'); T.style.backgroundImage=`url("${u}")`; T.classList.add('hasimg'); } });
$('#sSize').value=cfg.size; $('#charWrap').classList.toggle('full',cfg.size==='full');
$('#sSize').onchange=e=>{cfg.size=e.target.value;store.set('kkn_cfg',cfg);$('#charWrap').classList.toggle('full',cfg.size==='full');};
$('#sSpeed').value=cfg.speed; $('#sAuto').value=cfg.auto;
$('#sSpeed').oninput=e=>{cfg.speed=+e.target.value;store.set('kkn_cfg',cfg);};
$('#sAuto').oninput=e=>{cfg.auto=+e.target.value;store.set('kkn_cfg',cfg);};
const GAL=[['cg_box_sleep','君との出会い'],['cg_awake','はじめまして'],['cg_door','雨の夜の再会'],['cg_hug','目覚めの朝'],['cg_189','クオンと\u200b世界を揺らした日']];
function seenSet(){ return new Set(store.get('kkn_seen',[])); }
function markSeen(n){ if(!GAL.some(g=>g[0]===n)) return; const s=seenSet(); if(!s.has(n)){ s.add(n); store.set('kkn_seen',[...s]); } }
let galIdx=0,galOpen=[];
async function buildGallery(){
  const G=$('#galList'); G.innerHTML=''; const seen=seenSet();
  galOpen=GAL.filter(g=>seen.has(g[0]));
  $('#galCount').textContent=`閲覧済み ${galOpen.length} / ${GAL.length}`;
  for(const [n,label] of GAL){
    const el=document.createElement('div'); el.className='chap';
    if(seen.has(n)){
      el.innerHTML=`<div><div class="t">${label}</div></div>`;
      resolve('cg',n).then(u=>{ if(u) el.style.backgroundImage=`url("${u}")`; });
      el.onclick=()=>openCg(galOpen.findIndex(g=>g[0]===n));
    } else { el.classList.add('locked'); el.innerHTML=`<div><div class="t">？？？</div></div>`; }
    G.appendChild(el);
  }
}
async function openCg(i){
  galIdx=(i+galOpen.length)%galOpen.length; const v=$('#cgView');
  const u=await resolve('cg',galOpen[galIdx][0]); v.querySelector('img').src=u||'';
  $('#cgNo').textContent=`${galIdx+1} / ${galOpen.length}`;
  v.querySelector('.cgnav').style.visibility=galOpen.length>1?'visible':'hidden';
  v.classList.add('on');
}
$('#cgView').addEventListener('click',e=>{ if(e.target.closest('.cgnav')) return; $('#cgView').classList.remove('on'); });
$('#cgPrev').onclick=e=>{e.stopPropagation();openCg(galIdx-1);};
$('#cgNext').onclick=e=>{e.stopPropagation();openCg(galIdx+1);};

/* ---------- rain ---------- */
(function(){
  const c=$('#rain'),x=c.getContext('2d');let W,H,drops=[];
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight;drops=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,l:10+Math.random()*22,v:9+Math.random()*9}));}
  addEventListener('resize',rs);rs();
  (function loop(){ if(st.rain){ x.clearRect(0,0,W,H); x.strokeStyle='rgba(200,215,235,.32)'; x.lineWidth=1; x.beginPath();
    for(const d of drops){ x.moveTo(d.x,d.y); x.lineTo(d.x-d.l*.18,d.y+d.l); d.y+=d.v; d.x-=d.v*.18; if(d.y>H){d.y=-20;d.x=Math.random()*W*1.1;} } x.stroke(); }
    requestAnimationFrame(loop); })();
})();
</script>
